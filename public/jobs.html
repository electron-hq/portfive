<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jobs - PortFive</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FAFAFA">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --text: #09090B;
      --text-muted: #71717A; --line: #E4E4E7;
      --primary: #18181B; --primary-hover: #27272A;
      --accent: #6366F1; --accent-light: #EEF2FF;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 85px; color: var(--text); }

    .top-nav { position: sticky; top: 0; z-index: 100; background: rgba(250, 250, 250, 0.98); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .nav-title { font-family: 'Archivo', sans-serif; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }
    .icon-btn { background: none; border: none; cursor: pointer; color: var(--text); padding: 6px; border-radius: 50%; transition: 0.2s; display: flex; text-decoration: none;}
    .icon-btn:hover { background: var(--line); }
    .icon-btn svg { width: 22px; height: 22px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .container { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* Search Bar */
    .search-wrap { position: relative; margin-bottom: 20px; }
    .search-input { width: 100%; padding: 14px 16px 14px 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 0.95rem; font-family: inherit; color: var(--text); outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: var(--text-muted); fill: none; stroke-width: 2; }

    /* Job List */
    .job-list { display: flex; flex-direction: column; gap: 16px; }
    .job-card { background: var(--surface); padding: 20px; border-radius: 16px; border: 1px solid var(--line); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 2px 8px rgba(9,9,11,0.02); }
    .job-card:hover { border-color: #D4D4D8; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(9,9,11,0.05); }
    
    .job-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .job-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); flex-shrink: 0; }
    .job-icon svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; }
    
    .job-title { font-family: 'Archivo', sans-serif; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; }
    .job-company { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
    
    .job-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .job-tag { font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .job-tag.salary { background: var(--accent-light); color: var(--accent); border-color: #C7D2FE; }
    
    .job-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--text-muted); }
    .job-type-tag { font-weight: 700; color: var(--text); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state svg { width: 48px; height: 48px; stroke: var(--line); margin-bottom: 15px; stroke-width: 1.5; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(250, 250, 250, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 68px; z-index: 1000; max-width: 600px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 0.6rem; font-weight: 600; gap: 5px; transition: 0.2s; width: 60px; }
    .nav-item.active { color: var(--text); }
    .nav-item svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.profile-nav .profile-pic { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #E4E4E7; margin-top: 1px; margin-bottom: 1px; }
    .nav-item.profile-nav .profile-pic > * { width: 100%; height: 100%; }
    .nav-item.profile-nav .profile-pic svg { display: block; border-radius: 50%; stroke: none; }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="nav-title">Jobs</div>
    <a href="/create-job.html" class="icon-btn" aria-label="Post a Job">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </a>
  </div>

  <div class="container">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search jobs by title, company, or location..." autocomplete="off">
    </div>

    <div class="job-list" id="jobContainer">
      <div style="text-align:center; padding:20px; color:var(--text-muted);">Loading jobs...</div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item active"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>Jobs</a>
    <a href="/pens.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Pens</a>
    <a href="/home.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home</a>
    <a href="/images.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>Images</a>
    <a href="/profile.html" class="nav-item profile-nav"><div class="profile-pic" id="navProfilePic"></div></a>
  </div>

  <script>
    function esc(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeUrl(url) {
      return String(url || '').replace(/'/g, '%27').replace(/"/g, '%22').replace(/\(/g, '%28').replace(/\)/g, '%29').replace(/\s/g, '%20').replace(/</g, '%3C').replace(/>/g, '%3E');
    }
    function getAvatarSVG(user) {
      if (user && user.profilePic) {
        return `<div style="width:100%; height:100%; background-image:url('${safeUrl(user.profilePic)}'); background-size:cover; background-position:center;"></div>`;
      }
      const first = user && user.fullName ? Array.from(String(user.fullName).trim())[0] : '';
      const initial = esc((first || 'U').toUpperCase());
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" role="img" aria-label="Avatar"><rect width="100" height="100" fill="#E4E4E7"/><text x="50" y="50" font-size="46" font-family="'Inter', Arial, sans-serif" font-weight="700" fill="#09090B" text-anchor="middle" dominant-baseline="central">${initial}</text></svg>`;
    }
    function timeAgo(dateString) {
      if (!dateString) return 'Just now';
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      if (seconds < 60) return 'Just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h ago';
      const days = Math.floor(hours / 24);
      if (days < 7) return days + 'd ago';
      return date.toLocaleDateString();
    }

    let searchTimeout = null;

    async function init() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          const navPic = document.getElementById('navProfilePic');
          if (data.user.profilePic) {
            navPic.style.backgroundImage = `url('${safeUrl(data.user.profilePic)}')`;
            navPic.style.backgroundSize = 'cover';
            navPic.style.backgroundPosition = 'center';
          } else {
            navPic.innerHTML = getAvatarSVG(data.user);
          }
          fetchJobs(); // Initial load
        } else { window.location.href = '/login.html'; }
      } catch (err) { window.location.href = '/login.html'; }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        fetchJobs(e.target.value.trim());
      }, 500); // Debounce search
    });

    async function fetchJobs(searchQuery = '') {
      const container = document.getElementById('jobContainer');
      container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Loading...</div>';

      try {
        const url = searchQuery ? `/api/jobs?search=${encodeURIComponent(searchQuery)}` : '/api/jobs';
        const res = await fetch(url, { credentials: 'include' });
        const jobs = await res.json();

        if (!jobs || jobs.length === 0) {
          container.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            <p>No jobs found${searchQuery ? ' for this search' : ''}.</p>
          </div>`;
          return;
        }

        container.innerHTML = jobs.map(j => {
          const author = j.author || {};
          return `
            <div class="job-card" onclick="window.location.href='/job.html?id=${esc(j._id)}'">
              <div class="job-header">
                <div>
                  <div class="job-title">${esc(j.title)}</div>
                  <div class="job-company">${esc(j.companyName)}</div>
                </div>
                <div class="job-icon">
                  <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                </div>
              </div>
              
              <div class="job-tags">
                <span class="job-tag">${esc(j.location || 'Remote')}</span>
                <span class="job-tag salary">${esc(j.salary || 'Negotiable')}</span>
              </div>

              <div class="job-footer">
                <div class="job-type-tag">${esc(j.jobType)}</div>
                <div style="display:flex; align-items:center; gap:6px;">
                  <div style="width:20px;height:20px;border-radius:50%;overflow:hidden;background:#E4E4E7;">${getAvatarSVG(author)}</div>
                  <span>Posted ${timeAgo(j.createdAt)}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div style="text-align:center; color:var(--red); padding:20px;">Failed to load jobs.</div>';
      }
    }

    init();
  </script>
</body>
</html>
