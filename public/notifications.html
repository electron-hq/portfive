<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notifications - PortFive</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FAFAFA">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --text: #09090B;
      --text-muted: #71717A; --line: #E4E4E7;
      --primary: #18181B; --primary-hover: #27272A;
      --accent: #6366F1; --accent-light: #EEF2FF;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 85px; color: var(--text); }

    .top-nav { position: sticky; top: 0; z-index: 100; background: rgba(250, 250, 250, 0.98); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; gap: 16px; }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--text); padding: 4px; border-radius: 50%; }
    .back-btn:hover { background: var(--line); }
    .back-btn svg { width: 24px; height: 24px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .nav-title { font-family: 'Archivo', sans-serif; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }

    .container { max-width: 600px; margin: 0 auto; padding: 16px; }

    .notif-list { display: flex; flex-direction: column; gap: 8px; }
    .notif-item { display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); cursor: pointer; transition: 0.2s; }
    .notif-item:hover { background: #F4F4F5; }
    .notif-item.unread { background: var(--accent-light); border-color: #C7D2FE; }
    
    .avatar-container { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #E4E4E7; }
    .avatar-container svg { display: block; width: 100%; height: 100%; border-radius: 50%; }
    
    .notif-content { flex: 1; min-width: 0; }
    .notif-text { font-size: 0.95rem; line-height: 1.4; color: var(--text); margin-bottom: 4px; }
    .notif-text strong { font-weight: 600; }
    .notif-time { font-size: 0.75rem; color: var(--text-muted); }
    
    .notif-icon { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
    .notif-icon svg { width: 24px; height: 24px; fill: none; stroke-width: 2; }
    .icon-heart { stroke: var(--red); fill: var(--red); }
    .icon-comment { stroke: var(--accent); }
    .icon-follow { stroke: var(--accent); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state svg { width: 60px; height: 60px; stroke: var(--line); margin-bottom: 15px; stroke-width: 1.5; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(250, 250, 250, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 68px; z-index: 1000; max-width: 600px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 0.6rem; font-weight: 600; gap: 5px; transition: 0.2s; width: 60px; }
    .nav-item svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.profile-nav .profile-pic { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #E4E4E7; margin-top: 1px; margin-bottom: 1px; }
    .nav-item.profile-nav .profile-pic > * { width: 100%; height: 100%; }
    .nav-item.profile-nav .profile-pic svg { display: block; border-radius: 50%; stroke: none; }
  </style>
</head>
<body>

  <div class="top-nav">
    <button class="back-btn" onclick="window.history.back()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    </button>
    <div class="nav-title">Notifications</div>
  </div>

  <div class="container">
    <div class="notif-list" id="notifList">
      <div style="text-align:center; padding:40px 20px; color:var(--text-muted);">Loading notifications...</div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>Jobs</a>
    <a href="/pens.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Pens</a>
    <a href="/home.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home</a>
    <a href="/images.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>Images</a>
    <a href="/profile.html" class="nav-item profile-nav"><div class="profile-pic" id="navProfilePic"></div></a>
  </div>

  <script>
    function esc(value) {
      return String(value === null || value === undefined ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeUrl(url) {
      return String(url || '').replace(/'/g, '%27').replace(/"/g, '%22').replace(/\(/g, '%28').replace(/\)/g, '%29').replace(/\s/g, '%20');
    }
    function getAvatarSVG(user) {
      if (user && user.profilePic) return `<div style="width:100%; height:100%; background-image:url('${safeUrl(user.profilePic)}'); background-size:cover; background-position:center;"></div>`;
      const first = user && user.fullName ? Array.from(String(user.fullName).trim())[0] : '';
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" shape-rendering="geometricPrecision"><rect width="100" height="100" fill="#E4E4E7"/><text x="50" y="50" font-size="46" font-family="'Inter', Arial, sans-serif" font-weight="700" fill="#09090B" text-anchor="middle" dominant-baseline="central">${esc((first || 'U').toUpperCase())}</text></svg>`;
    }
    function timeAgo(dateString) {
      if (!dateString) return 'Just now';
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      if (seconds < 60) return 'Just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h ago';
      const days = Math.floor(hours / 24);
      if (days < 7) return days + 'd ago';
      return date.toLocaleDateString();
    }

    async function init() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          const navPic = document.getElementById('navProfilePic');
          if (data.user.profilePic) {
            navPic.style.backgroundImage = `url('${safeUrl(data.user.profilePic)}')`;
            navPic.style.backgroundSize = 'cover';
            navPic.style.backgroundPosition = 'center';
          } else {
            navPic.innerHTML = getAvatarSVG(data.user);
          }
          loadNotifications();
        } else { window.location.href = '/login.html'; }
      } catch (err) { window.location.href = '/login.html'; }
    }

    async function loadNotifications() {
      const container = document.getElementById('notifList');
      try {
        const res = await fetch('/api/notifications', { credentials: 'include' });
        const notifs = await res.json();

        if (!notifs || notifs.length === 0) {
          container.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <p>No notifications yet.</p>
          </div>`;
          return;
        }

        // Mark all as read after loading
        fetch('/api/notifications/read', { method: 'PUT', credentials: 'include' });

        container.innerHTML = notifs.map(n => {
          const sender = n.sender || {};
          const post = n.postId || {};
          let text = '';
          let iconSvg = '';
          let link = `/profile.html?id=${esc(sender._id)}`;

          if (n.type === 'follow' || n.type === 'mutual_follow') {
            text = n.type === 'mutual_follow' ? `<strong>${esc(sender.fullName)}</strong> and you are now friends!` : `<strong>${esc(sender.fullName)}</strong> started following you.`;
            iconSvg = `<svg viewBox="0 0 24 24" class="icon-follow"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>`;
          } else if (n.type === 'like') {
            text = `<strong>${esc(sender.fullName)}</strong> loved your ${post.postType === 'pen' ? 'article' : 'post'}.`;
            iconSvg = `<svg viewBox="0 0 24 24" class="icon-heart"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
            link = `/post.html?id=${esc(post._id)}`;
          } else if (n.type === 'comment') {
            text = `<strong>${esc(sender.fullName)}</strong> commented on your ${post.postType === 'pen' ? 'article' : 'post'}.`;
            iconSvg = `<svg viewBox="0 0 24 24" class="icon-comment"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`;
            link = `/post.html?id=${esc(post._id)}`;
          }

          return `
            <div class="notif-item ${n.isRead ? '' : 'unread'}" onclick="window.location.href='${link}'">
              <div class="avatar-container">${getAvatarSVG(sender)}</div>
              <div class="notif-content">
                <div class="notif-text">${text}</div>
                <div class="notif-time">${timeAgo(n.createdAt)}</div>
              </div>
              <div class="notif-icon">${iconSvg}</div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div style="text-align:center; color:var(--red); padding:20px;">Failed to load notifications.</div>';
      }
    }

    init();
  </script>
</body>
</html>
