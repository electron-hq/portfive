<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Bold P with Chat Bubble Tail -->
  <g filter="url(#shadow)">
    <path d="M 160 120 L 160 392" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
    <path d="M 160 120 L 280 120 C 346 120 400 174 400 240 C 400 306 346 360 280 360 L 160 360" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 160 360 L 115 405" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
  </g>
  
  <!-- Notification Dot -->
  <circle cx="380" cy="140" r="48" fill="#EF4444" stroke="#FFFFFF" stroke-width="12"/>
</svg>
