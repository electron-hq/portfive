<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pens - PortFive</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FAFAFA">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --text: #09090B;
      --text-muted: #71717A; --line: #E4E4E7;
      --primary: #18181B; --primary-hover: #27272A;
      --accent: #6366F1; --accent-light: #EEF2FF;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 85px; color: var(--text); -webkit-font-smoothing: antialiased; }

    /* Top Navbar */
    .top-nav { position: sticky; top: 0; z-index: 100; background: rgba(250, 250, 250, 0.98); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .nav-title { font-family: 'Archivo', sans-serif; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }
    .icon-btn { background: none; border: none; cursor: pointer; color: var(--text); padding: 6px; border-radius: 50%; transition: 0.2s; display: flex; text-decoration: none;}
    .icon-btn:hover { background: var(--line); }
    .icon-btn svg { width: 22px; height: 22px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* Container */
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* Search Bar */
    .search-wrap { position: relative; margin-bottom: 20px; }
    .search-input { width: 100%; padding: 14px 16px 14px 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 0.95rem; font-family: inherit; color: var(--text); outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: var(--text-muted); fill: none; stroke-width: 2; }

    /* Pen List */
    .pen-list { display: flex; flex-direction: column; gap: 20px; }

    .pen-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; cursor: pointer; box-shadow: 0 2px 8px rgba(9,9,11,0.02); transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s; }
    .pen-card:hover { border-color: #D4D4D8; box-shadow: 0 6px 16px rgba(9,9,11,0.06); transform: translateY(-2px); }

    .pen-cover { width: 100%; aspect-ratio: 3 / 1; background: #18181B; background-size: cover; background-position: center; border-bottom: 1px solid var(--line); }

    .pen-info { padding: 20px 20px 16px; }
    .pen-title { font-family: 'Archivo', sans-serif; font-size: 1.35rem; font-weight: 700; line-height: 1.3; color: var(--text); margin-bottom: 10px; letter-spacing: -0.3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pen-snippet { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 16px; }
    
    /* Author Info */
    .pen-author-row { display: flex; align-items: center; padding-top: 16px; border-top: 1px solid var(--line); }
    .author-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar-container { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #E4E4E7; }
    .avatar-container svg { display: block; width: 100%; height: 100%; border-radius: 50%; }
    .author-text { display: flex; flex-direction: column; }
    .author-name { font-size: 0.85rem; font-weight: 600; color: var(--text); }
    .post-date { font-size: 0.75rem; color: var(--text-muted); }

    /* Action Bar */
    .action-bar { display: flex; gap: 20px; padding: 12px 20px; border-top: 1px solid var(--line); align-items: center; }
    .action-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: 0.2s; font-family: inherit; }
    .action-btn:hover { background: var(--bg); color: var(--text); }
    .action-btn svg { width: 20px; height: 20px; stroke-width: 2; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .action-btn.loved { color: var(--red); }
    .action-btn.loved svg { fill: var(--red); stroke: var(--red); }
    .action-btn.saved { color: var(--accent); }
    .action-btn.saved svg { fill: var(--accent); stroke: var(--accent); }
    .action-btn.share-btn { margin-left: auto; }

    /* Empty State */
    .global-empty-state { display: none; text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .global-empty-state .icon-wrapper { width: 80px; height: 80px; background: var(--surface); color: var(--text); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; border: 1px solid var(--line); }
    .global-empty-state .icon-wrapper svg { width: 36px; height: 36px; stroke-width: 1.5; }
    .global-empty-state h2 { font-family: 'Archivo', sans-serif; color: var(--text); font-size: 1.2rem; margin-bottom: 8px; letter-spacing: -0.5px; }
    .global-empty-state p { font-size: 0.95rem; margin-bottom: 25px; }
    .btn-start { background: var(--primary); color: white; padding: 12px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 0.95rem; display: inline-block; }
    .btn-start:hover { background: var(--primary-hover); }

    /* Skeleton */
    .sk { background: linear-gradient(90deg, #EFEFF1 25%, #F6F6F8 50%, #EFEFF1 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite linear; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .sk-card { height: 280px; border-radius: 16px; margin-bottom: 20px; }

    /* Share Modal (Bottom Sheet) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .share-modal { position: fixed; bottom: 0; left: 0; right: 0; height: 60vh; background: var(--surface); border-radius: 20px 20px 0 0; z-index: 2001; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); box-shadow: 0 -4px 24px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
    .share-modal.active { transform: translateY(0); }
    .modal-drag-handle { width: 40px; height: 5px; background: #E4E4E7; border-radius: 10px; margin: 10px auto 0; flex-shrink: 0; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .modal-title { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 1.1rem; }
    .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; line-height: 1; }
    .friends-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .friend-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
    .friend-item:hover { background: var(--bg); border-color: var(--line); }
    .friend-info { display: flex; align-items: center; gap: 12px; }
    .friend-info .avatar-container { width: 40px; height: 40px; }
    .friend-name { font-weight: 600; font-size: 0.95rem; }
    .friend-username { font-size: 0.8rem; color: var(--text-muted); }
    .send-btn { background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .send-btn:hover { background: var(--primary-hover); }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(250, 250, 250, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 68px; z-index: 1000; max-width: 600px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 0.6rem; font-weight: 600; gap: 5px; transition: 0.2s; width: 60px; }
    .nav-item.active { color: var(--text); }
    .nav-item svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.profile-nav .profile-pic { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #E4E4E7; margin-top: 1px; margin-bottom: 1px; }
    .nav-item.profile-nav .profile-pic > * { width: 100%; height: 100%; }
    .nav-item.profile-nav .profile-pic svg { display: block; border-radius: 50%; stroke: none; }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="nav-title">Pens</div>
    <a href="/create-post.html" class="icon-btn" aria-label="Create Pen">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </a>
  </div>

  <div class="container">
    <!-- Search Bar -->
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search pens by title or content..." autocomplete="off">
    </div>

    <div class="pen-list" id="penContainer">
      <div class="sk sk-card"></div>
      <div class="sk sk-card"></div>
    </div>

    <div class="global-empty-state" id="globalEmptyState">
      <div class="icon-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path>
        </svg>
      </div>
      <h2>No articles found</h2>
      <p>Try searching with different keywords or be the first to share a Pen.</p>
      <a href="/create-post.html" class="btn-start">Write a Pen</a>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal-overlay" id="shareOverlay" onclick="closeShareModal()"></div>
  <div class="share-modal" id="shareModal">
    <div class="modal-drag-handle"></div>
    <div class="modal-header">
      <div class="modal-title">Share to Friend</div>
      <button class="modal-close" onclick="closeShareModal()">&times;</button>
    </div>
    <div class="friends-list" id="shareFriendsList">
      <div style="text-align:center; color:var(--text-muted); font-size:0.9rem;">Loading friends...</div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>Jobs</a>
    <a href="/pens.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Pens</a>
    <a href="/home.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home</a>
    <a href="/images.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>Images</a>
    <a href="/profile.html" class="nav-item profile-nav"><div class="profile-pic" id="navProfilePic"></div></a>
  </div>

  <script>
    let currentUserId = null;
    let sharingPostId = null;
    let allPens = []; // Store all fetched pens for client-side filtering

    function esc(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeUrl(url) {
      return String(url || '').replace(/'/g, '%27').replace(/"/g, '%22').replace(/\(/g, '%28').replace(/\)/g, '%29').replace(/\s/g, '%20').replace(/</g, '%3C').replace(/>/g, '%3E');
    }
    function timeAgo(dateString) {
      if (!dateString) return 'Just now';
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      if (seconds < 60) return 'Just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h ago';
      const days = Math.floor(hours / 24);
      if (days < 7) return days + 'd ago';
      return date.toLocaleDateString();
    }
    function formatCount(num) {
      if (!num) return 0;
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return num;
    }
    function getAvatarSVG(user) {
      if (user && user.profilePic) {
        return `<div style="width:100%; height:100%; background-image:url('${safeUrl(user.profilePic)}'); background-size:cover; background-position:center;"></div>`;
      }
      const first = user && user.fullName ? Array.from(String(user.fullName).trim())[0] : '';
      const initial = esc((first || 'U').toUpperCase());
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" role="img" aria-label="Avatar"><rect width="100" height="100" fill="#E4E4E7"/><text x="50" y="50" font-size="46" font-family="'Inter', Arial, sans-serif" font-weight="700" fill="#09090B" text-anchor="middle" dominant-baseline="central">${initial}</text></svg>`;
    }

    async function init() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          currentUserId = data.user.id || data.user._id;

          const navPic = document.getElementById('navProfilePic');
          if (data.user.profilePic) {
            navPic.style.backgroundImage = `url('${safeUrl(data.user.profilePic)}')`;
            navPic.style.backgroundSize = 'cover';
            navPic.style.backgroundPosition = 'center';
          } else {
            navPic.innerHTML = getAvatarSVG(data.user);
          }
          loadPens();
        } else { window.location.href = '/login.html'; }
      } catch (err) { window.location.href = '/login.html'; }
    }

    async function loadPens() {
      const container = document.getElementById('penContainer');
      try {
        const res = await fetch('/api/posts/top/pen', { credentials: 'include' });
        allPens = await res.json();
        
        // Render initial pens
        renderPens(allPens);

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--red);">Failed to load pens.</div>';
      }
    }

    // Function to render pens based on the array passed (either full list or filtered list)
    function renderPens(pensToRender) {
      const container = document.getElementById('penContainer');
      const emptyState = document.getElementById('globalEmptyState');

      if (!pensToRender || pensToRender.length === 0) {
        container.innerHTML = '';
        container.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      container.style.display = 'flex';
      emptyState.style.display = 'none';

      container.innerHTML = pensToRender.map(p => {
        const author = p.author || {};
        const authorId = author._id || '';
        const authorName = author.fullName || 'Unknown';
        const username = author.username || 'unknown';
        const time = timeAgo(p.createdAt);
        const snippet = (p.content || '').substring(0, 200) + (p.content && p.content.length > 200 ? '...' : '');

        const loveCount = p.reactions ? p.reactions.filter(r => r.type === 'love').length : 0;
        const hasLoved = p.reactions && p.reactions.some(r => (r.user === currentUserId || r.user?._id === currentUserId) && r.type === 'love');
        const isSaved = p.isSaved || false;

        return `
          <div class="pen-card" onclick="window.location.href='/post.html?id=${esc(p._id)}'">
            ${p.mediaUrl ? `<div class="pen-cover" style="background-image:url('${safeUrl(p.mediaUrl)}')"></div>` : ''}

            <div class="pen-info">
              <div class="pen-title">${esc(p.title || 'Untitled Article')}</div>
              <div class="pen-snippet">${esc(snippet)}</div>
              <div class="pen-author-row">
                <div class="author-info" onclick="event.stopPropagation(); window.location.href='/profile.html?id=${esc(authorId)}'">
                  <div class="avatar-container">${getAvatarSVG(author)}</div>
                  <div class="author-text">
                    <span class="author-name">${esc(authorName)}</span>
                    <span class="post-date">${esc(time)}</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Action Bar (Love, Comments, Save, Share) -->
            <div class="action-bar">
              <button class="action-btn ${hasLoved ? 'loved' : ''}" onclick="toggleLove(event, '${esc(p._id)}', this)">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                <span class="count">${formatCount(loveCount)}</span>
              </button>

              <button class="action-btn" onclick="event.stopPropagation(); window.location.href='/post.html?id=${esc(p._id)}'">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span class="count">${formatCount(p.commentsCount || 0)}</span>
              </button>

              <button class="action-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave(event, '${esc(p._id)}', this)">
                <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              </button>

              <button class="action-btn share-btn" onclick="openShareModal(event, '${esc(p._id)}')">
                <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Search functionality
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      
      if (!query) {
        renderPens(allPens);
      } else {
        const filtered = allPens.filter(p => {
          const titleMatch = p.title && p.title.toLowerCase().includes(query);
          const contentMatch = p.content && p.content.toLowerCase().includes(query);
          return titleMatch || contentMatch;
        });
        renderPens(filtered);
      }
    });

    async function toggleLove(e, postId, btn) {
      e.stopPropagation();
      const isLoved = btn.classList.contains('loved');
      const countSpan = btn.querySelector('.count');
      let currentVal = parseFloat(countSpan.innerText) || 0;
      if (countSpan.innerText.includes('k')) currentVal = currentVal * 1000;

      if (isLoved) {
        btn.classList.remove('loved');
        countSpan.innerText = formatCount(Math.max(0, currentVal - 1));
      } else {
        btn.classList.add('loved');
        countSpan.innerText = formatCount(currentVal + 1);
      }
      
      try {
        await fetch(`/api/posts/${postId}/react`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ type: 'love' })
        });
      } catch (err) {
        if (isLoved) { btn.classList.add('loved'); countSpan.innerText = formatCount(currentVal); }
        else { btn.classList.remove('loved'); countSpan.innerText = formatCount(currentVal); }
      }
    }

    async function toggleSave(e, postId, btn) {
      e.stopPropagation();
      const isSaved = btn.classList.contains('saved');
      if (isSaved) btn.classList.remove('saved');
      else btn.classList.add('saved');
      
      try {
        await fetch(`/api/posts/${postId}/save`, { method: 'POST', credentials: 'include' });
      } catch (err) {
        if (isSaved) btn.classList.add('saved');
        else btn.classList.remove('saved');
      }
    }

    // --- Share Modal Logic ---
    function openShareModal(e, postId) {
      e.stopPropagation();
      sharingPostId = postId;
      document.getElementById('shareOverlay').classList.add('active');
      document.getElementById('shareModal').classList.add('active');
      document.body.style.overflow = 'hidden';
      loadFriendsForShare();
    }

    function closeShareModal() {
      document.getElementById('shareOverlay').classList.remove('active');
      document.getElementById('shareModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    async function loadFriendsForShare() {
      const list = document.getElementById('shareFriendsList');
      list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Loading friends...</div>';

      try {
        const res = await fetch(`/api/users/friends/${currentUserId}`, { credentials: 'include' });
        const friends = await res.json();
        
        if (!friends || friends.length === 0) {
          list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">No friends found. Follow someone first!</div>';
          return;
        }

        list.innerHTML = friends.map(f => `
          <div class="friend-item">
            <div class="friend-info">
              <div class="avatar-container">${getAvatarSVG(f)}</div>
              <div>
                <div class="friend-name">${esc(f.fullName)}</div>
                <div class="friend-username">@${esc(f.username)}</div>
              </div>
            </div>
            <button class="send-btn" onclick="shareToFriend('${esc(f._id)}', this)">Send</button>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--red);">Failed to load friends.</div>';
      }
    }

    async function shareToFriend(friendId, btn) {
      btn.innerText = 'Sending...';
      btn.disabled = true;

      const postLink = window.location.origin + '/post.html?id=' + sharingPostId;
      const textMessage = `Check out this Pen: ${postLink}`;

      try {
        const res = await fetch('/api/chat/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ receiverId: friendId, text: textMessage })
        });

        if (res.ok) {
          btn.innerText = 'Sent!';
          btn.style.background = '#10B981';
          setTimeout(() => closeShareModal(), 1000);
        } else {
          btn.innerText = 'Failed';
          btn.disabled = false;
        }
      } catch (err) {
        btn.innerText = 'Error';
        btn.disabled = false;
      }
    }

    init();
  </script>
</body>
