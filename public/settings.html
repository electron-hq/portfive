<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings - PortFive</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #FAFAFA; --surface: #FFFFFF; --text: #09090B; 
      --text-muted: #71717A; --line: #E4E4E7; 
      --primary: #18181B; --primary-hover: #27272A; 
      --accent: #6366F1; --accent-light: #EEF2FF;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 50px; color: var(--text); }

    /* Top Navbar */
    .top-nav { position: sticky; top: 0; z-index: 100; background: rgba(250, 250, 250, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 15px; }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--text); display: flex; align-items: center; padding: 5px; border-radius: 50%; }
    .back-btn:hover { background: var(--line); }
    .back-btn svg { width: 24px; height: 24px; stroke-width: 2; stroke: currentColor; fill: none; }
    .title { font-size: 1.1rem; font-weight: 700; }

    /* Container */
    .container { max-width: 600px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

    /* Settings Card */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .card-header { padding: 15px 20px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 1rem; background: #FAFAFA; }
    .card-body { padding: 20px; }

    /* Form Styles */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text); }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 0.95rem; outline: none; background: var(--bg); color: var(--text); transition: 0.2s; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); background: var(--surface); }
    
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; transition: 0.2s; display: inline-block; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-full { width: 100%; }

    /* Sliding Security Form */
    .security-slider { overflow: hidden; width: 100%; }
    .security-track { display: flex; width: 200%; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .security-slide { width: 50%; padding: 0 5px; }
    .security-slide:first-child { padding-left: 0; padding-right: 15px; }
    .security-slide:last-child { padding-left: 15px; padding-right: 0; }
    
    .verify-success { display: flex; align-items: center; gap: 8px; color: var(--accent); font-size: 0.9rem; font-weight: 600; margin-bottom: 15px; padding: 10px; background: var(--accent-light); border-radius: 8px; }

    /* Toggle Switch */
    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
    .toggle-info h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 3px; }
    .toggle-info p { font-size: 0.8rem; color: var(--text-muted); }
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #CBD5E1; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Earnings Box */
    .earnings-box { background: var(--accent-light); border: 1px solid #C7D2FE; border-radius: 10px; padding: 15px; margin-top: 15px; display: none; }
    .earnings-box h4 { font-size: 0.9rem; color: #3730A3; margin-bottom: 5px; }
    .earnings-box .amount { font-size: 1.5rem; font-weight: 800; color: #3730A3; }
    .earnings-box p { font-size: 0.75rem; color: #4338CA; margin-top: 5px; }

    /* Danger Zone */
    .danger-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .danger-item:last-child { border-bottom: none; }
    .danger-item:hover { background: var(--bg); }
    .danger-item span { font-weight: 600; font-size: 0.95rem; color: var(--text); }
    .danger-item.logout span { color: var(--text); }
    .danger-item.delete span { color: var(--red); }
    .danger-item svg { width: 20px; height: 20px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
    .danger-item.delete svg { stroke: var(--red); }

    /* Toast */
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--primary); color: white; padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.2); opacity: 0; transition: all 0.3s; z-index: 3000; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="top-nav">
    <button class="back-btn" onclick="window.location.href='/profile.html'">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="title">Settings</div>
  </div>

  <div class="container">

    <!-- Edit Profile -->
    <div class="card">
      <div class="card-header">Edit Profile</div>
      <div class="card-body">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" placeholder="Your Name">
        </div>
        <div class="form-group">
          <label>Bio (Max 100 chars)</label>
          <textarea id="bio" rows="2" maxlength="100" placeholder="Tell us about yourself"></textarea>
        </div>
        <div class="form-group">
          <label>Website Title</label>
          <input type="text" id="webTitle" placeholder="My Portfolio">
        </div>
        <div class="form-group">
          <label>Website URL</label>
          <input type="url" id="webUrl" placeholder="https://example.com">
        </div>
        <button class="btn btn-primary btn-full" onclick="updateProfile()">Save Profile</button>
      </div>
    </div>

    <!-- Monetization -->
    <div class="card">
      <div class="card-header">Monetization</div>
      <div class="card-body">
        <div class="toggle-row">
          <div class="toggle-info">
            <h4>Allow Ads on Profile</h4>
            <p>Show ads on your image posts to earn revenue.</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="allowAdsToggle" onchange="toggleAds(this.checked)">
            <span class="slider"></span>
          </label>
        </div>
        <div class="earnings-box" id="earningsBox">
          <h4>Estimated Earnings</h4>
          <div class="amount" id="earningsAmount">$0.00</div>
          <p>Total Impressions: <span id="impressionsCount">0</span>. Revenue share payout will be available soon.</p>
        </div>
      </div>
    </div>

    <!-- Security (2-Step Slider) -->
    <div class="card">
      <div class="card-header">Security</div>
      <div class="card-body">
        <div class="security-slider">
          <div class="security-track" id="securityTrack">
            
            <!-- Step 1: Verify Old Password -->
            <div class="security-slide">
              <div class="form-group">
                <label>Old Password</label>
                <input type="password" id="oldPass" placeholder="Enter current password">
              </div>
              <button class="btn btn-primary btn-full" onclick="verifyPassword()" id="verifyBtn">Verify</button>
            </div>

            <!-- Step 2: Enter New Password -->
            <div class="security-slide">
              <div class="verify-success">
                <svg viewBox="0 0 24 24" style="width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                Identity Verified
              </div>
              <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPass" placeholder="Enter new password">
              </div>
              <button class="btn btn-primary btn-full" onclick="updatePassword()" id="updateBtn">Update Password</button>
              <button class="btn btn-outline btn-full" style="margin-top: 10px;" onclick="resetSecurityForm()">Cancel</button>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Account Actions -->
    <div class="card">
      <div class="danger-item logout" onclick="logout()">
        <span>Logout</span>
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </div>
      <div class="danger-item delete" onclick="deleteAccount()">
        <span>Delete Account Permanently</span>
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </div>
    </div>

  </div>

  <div class="toast" id="toast">Saved!</div>

  <script>
    let currentUser = null;
    let verifiedOldPassword = ""; // Temporarily store the verified password

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function init() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        currentUser = data.user;

        document.getElementById('fullName').value = currentUser.fullName || '';
        document.getElementById('bio').value = currentUser.bio || '';
        
        if (currentUser.website) {
          document.getElementById('webTitle').value = currentUser.website.title || '';
          document.getElementById('webUrl').value = currentUser.website.url || '';
        }

        const allowAdsToggle = document.getElementById('allowAdsToggle');
        const earningsBox = document.getElementById('earningsBox');
        const impressionsCount = document.getElementById('impressionsCount');
        const earningsAmount = document.getElementById('earningsAmount');

        if (currentUser.allowAds) {
          allowAdsToggle.checked = true;
          earningsBox.style.display = 'block';
          impressionsCount.innerText = currentUser.adImpressions || 0;
          const estEarnings = ((currentUser.adImpressions || 0) / 1000) * 0.50;
          earningsAmount.innerText = `$${estEarnings.toFixed(2)}`;
        } else {
          allowAdsToggle.checked = false;
          earningsBox.style.display = 'none';
        }

      } catch (err) {
        window.location.href = '/login.html';
      }
    }
    init();

    async function updateProfile() {
      const fullName = document.getElementById('fullName').value.trim();
      const bio = document.getElementById('bio').value.trim();
      const websiteTitle = document.getElementById('webTitle').value.trim();
      const websiteUrl = document.getElementById('webUrl').value.trim();

      try {
        const res = await fetch('/api/users/update-profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, bio, websiteTitle, websiteUrl }),
          credentials: 'include'
        });
        if (res.ok) showToast('Profile updated successfully!');
        else showToast('Failed to update profile.');
      } catch (err) { showToast('Server error.'); }
    }

    // Step 1: Verify Password
    async function verifyPassword() {
      const oldPass = document.getElementById('oldPass').value;
      if (!oldPass) return showToast('Please enter your old password.');

      const btn = document.getElementById('verifyBtn');
      btn.innerText = 'Verifying...'; btn.disabled = true;

      try {
        const res = await fetch('/api/users/verify-identity', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oldPassword: oldPass }),
          credentials: 'include'
        });
        
        if (res.ok) {
          verifiedOldPassword = oldPass; // Save for step 2
          showToast('Identity verified successfully!');
          
          // Slide to Step 2
          document.getElementById('securityTrack').style.transform = 'translateX(-50%)';
          
          // Clear old input
          document.getElementById('oldPass').value = '';
        } else {
          const data = await res.json();
          showToast(data.message || 'Incorrect password.');
        }
      } catch (err) {
        showToast('Server error.');
      } finally {
        btn.innerText = 'Verify'; btn.disabled = false;
      }
    }

    // Step 2: Update Password
    async function updatePassword() {
      const newPassword = document.getElementById('newPass').value;
      if (!newPassword || newPassword.length < 6) return showToast('New password must be at least 6 characters.');

      const btn = document.getElementById('updateBtn');
      btn.innerText = 'Updating...'; btn.disabled = true;

      try {
        const res = await fetch('/api/users/change-password', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oldPassword: verifiedOldPassword, newPassword }),
          credentials: 'include'
        });
        
        const data = await res.json();
        if (res.ok) {
          showToast('Password updated successfully!');
          resetSecurityForm(); // Slide back and clear
        } else {
          showToast(data.message || 'Failed to update password.');
        }
      } catch (err) {
        showToast('Server error.');
      } finally {
        btn.innerText = 'Update Password'; btn.disabled = false;
      }
    }

    // Reset the slider back to step 1
    function resetSecurityForm() {
      verifiedOldPassword = "";
      document.getElementById('newPass').value = '';
      document.getElementById('securityTrack').style.transform = 'translateX(0%)';
    }

    async function toggleAds(isChecked) {
      try {
        const res = await fetch('/api/users/toggle-ads', { method: 'PUT', credentials: 'include' });
        const data = await res.json();
        if (res.ok) {
          showToast(isChecked ? 'Ads enabled on your posts!' : 'Ads disabled.');
          document.getElementById('earningsBox').style.display = isChecked ? 'block' : 'none';
        } else {
          showToast('Failed to update setting.');
          document.getElementById('allowAdsToggle').checked = !isChecked;
        }
      } catch (err) {
        showToast('Server error.');
        document.getElementById('allowAdsToggle').checked = !isChecked;
      }
    }

    function logout() {
      if (!confirm('Are you sure you want to log out?')) return;
      fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }).then(() => {
        localStorage.removeItem('portfive_user');
        window.location.href = '/login.html';
      });
    }

    async function deleteAccount() {
      if (!confirm('Are you absolutely sure you want to delete your account? This action cannot be undone and all your posts will be lost.')) return;
      
      const confirmText = prompt('Type "DELETE" to confirm account deletion:');
      if (confirmText !== 'DELETE') return showToast('Deletion cancelled.');

      try {
        const res = await fetch('/api/users/delete-account', { method: 'DELETE', credentials: 'include' });
        if (res.ok) {
          localStorage.removeItem('portfive_user');
          window.location.href = '/register.html';
        } else {
          showToast('Failed to delete account.');
        }
      } catch (err) { showToast('Server error.'); }
    }
  </script>
</body>
</html>
