<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Job Details - PortFive</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FAFAFA">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --text: #09090B;
      --text-muted: #71717A; --line: #E4E4E7;
      --primary: #18181B; --primary-hover: #27272A;
      --accent: #6366F1; --accent-light: #EEF2FF;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 85px; color: var(--text); }

    .top-nav { position: sticky; top: 0; z-index: 100; background: rgba(250, 250, 250, 0.98); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; gap: 16px; }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--text); padding: 4px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: 0.2s; }
    .back-btn:hover { background: var(--line); }
    .back-btn svg { width: 24px; height: 24px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .nav-title { font-family: 'Archivo', sans-serif; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px; }

    .container { max-width: 600px; margin: 0 auto; padding: 20px; }

    .job-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(9,9,11,0.03); margin-bottom: 24px; }
    
    .job-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .job-title-area h1 { font-family: 'Archivo', sans-serif; font-size: 1.6rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.5px; margin-bottom: 6px; }
    .job-company { font-size: 1.05rem; color: var(--text-muted); font-weight: 500; }
    
    .job-icon { width: 56px; height: 56px; border-radius: 14px; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); flex-shrink: 0; }
    .job-icon svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; }

    .job-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
    .job-tag { font-size: 0.85rem; font-weight: 600; padding: 6px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); color: var(--text); display: flex; align-items: center; gap: 6px; }
    .job-tag.salary { background: var(--accent-light); color: var(--accent); border-color: #C7D2FE; }
    .job-tag svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

    .section-title { font-family: 'Archivo', sans-serif; font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; margin-top: 24px; }
    .job-desc { font-size: 0.95rem; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-wrap: break-word; }

    /* Action Buttons Area */
    .action-area { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; gap: 12px; }
    .btn-action { flex: 1; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; text-align: center; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 8px; font-family: 'Archivo', sans-serif; }
    
    .btn-primary { background: var(--primary); color: white; border: none; }
    .btn-primary:hover { background: var(--primary-hover); }
    
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .btn-outline:hover { background: var(--bg); border-color: #D4D4D8; }

    .meta-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .author-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .avatar-container { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: #E4E4E7; }
    .avatar-container svg { display: block; width: 100%; height: 100%; border-radius: 50%; }
    .author-text { display: flex; flex-direction: column; }
    .author-name { font-size: 0.9rem; font-weight: 600; }
    .post-date { font-size: 0.75rem; color: var(--text-muted); }
    
    .btn-delete { background: #FEF2F2; color: var(--red); border: 1px solid #FECACA; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
    .btn-delete:hover { background: #FEE2E2; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(250, 250, 250, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 68px; z-index: 1000; max-width: 600px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 0.6rem; font-weight: 600; gap: 5px; transition: 0.2s; width: 60px; }
    .nav-item svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.profile-nav .profile-pic { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #E4E4E7; margin-top: 1px; margin-bottom: 1px; }
    .nav-item.profile-nav .profile-pic > * { width: 100%; height: 100%; }
    .nav-item.profile-nav .profile-pic svg { display: block; border-radius: 50%; stroke: none; }
  </style>
</head>
<body>

  <div class="top-nav">
    <button class="back-btn" onclick="window.history.back()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    </button>
    <div class="nav-title">Job Details</div>
  </div>

  <div class="container" id="mainContainer">
    <div style="text-align:center; padding:60px 20px; color:var(--text-muted);">Loading...</div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item active"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>Jobs</a>
    <a href="/pens.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Pens</a>
    <a href="/home.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home</a>
    <a href="/images.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>Images</a>
    <a href="/profile.html" class="nav-item profile-nav"><div class="profile-pic" id="navProfilePic"></div></a>
  </div>

  <script>
    let currentUserId = null;
    let jobId = null;

    function esc(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeUrl(url) {
      return String(url || '').replace(/'/g, '%27').replace(/"/g, '%22').replace(/\(/g, '%28').replace(/\)/g, '%29').replace(/\s/g, '%20').replace(/</g, '%3C').replace(/>/g, '%3E');
    }
    function isSafeHttpUrl(url) {
      return /^https?:\/\//i.test(String(url || '').trim());
    }
    function getAvatarSVG(user) {
      if (user && user.profilePic) {
        return `<div style="width:100%; height:100%; background-image:url('${safeUrl(user.profilePic)}'); background-size:cover; background-position:center;"></div>`;
      }
      const first = user && user.fullName ? Array.from(String(user.fullName).trim())[0] : '';
      const initial = esc((first || 'U').toUpperCase());
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" role="img" aria-label="Avatar"><rect width="100" height="100" fill="#E4E4E7"/><text x="50" y="50" font-size="46" font-family="'Inter', Arial, sans-serif" font-weight="700" fill="#09090B" text-anchor="middle" dominant-baseline="central">${initial}</text></svg>`;
    }
    function timeAgo(dateString) {
      if (!dateString) return 'Just now';
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      if (seconds < 60) return 'Just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h ago';
      const days = Math.floor(hours / 24);
      if (days < 7) return days + 'd ago';
      return date.toLocaleDateString();
    }

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      jobId = urlParams.get('id');
      if (!jobId) {
        document.getElementById('mainContainer').innerHTML = '<div style="text-align:center; color:var(--red);">Job ID is missing.</div>';
        return;
      }

      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          currentUserId = data.user.id || data.user._id;
          
          const navPic = document.getElementById('navProfilePic');
          if (data.user.profilePic) {
            navPic.style.backgroundImage = `url('${safeUrl(data.user.profilePic)}')`;
            navPic.style.backgroundSize = 'cover';
            navPic.style.backgroundPosition = 'center';
          } else {
            navPic.innerHTML = getAvatarSVG(data.user);
          }
          loadJob();
        } else { window.location.href = '/login.html'; }
      } catch (err) { window.location.href = '/login.html'; }
    }

    async function loadJob() {
      try {
        const res = await fetch(`/api/jobs/${jobId}`, { credentials: 'include' });
        if (!res.ok) throw new Error('Job not found');
        const job = await res.json();
        renderJob(job);
      } catch (err) {
        document.getElementById('mainContainer').innerHTML = '<div style="text-align:center; color:var(--red); padding:20px;">Job not found or failed to load.</div>';
      }
    }

    function renderJob(job) {
      const author = job.author || {};
      const isOwner = author._id === currentUserId;
      const time = timeAgo(job.createdAt);

      let actionButtons = '';

      // Only show Apply button if link is valid
      if (job.applyLink && isSafeHttpUrl(job.applyLink)) {
        actionButtons += `<a href="${esc(job.applyLink)}" target="_blank" rel="noopener noreferrer" class="btn-action btn-primary">Apply Now</a>`;
      }

      // If not owner, show Message button. If owner, show Delete button.
      if (!isOwner) {
        actionButtons += `
          <a href="/chat-room.html?id=${esc(author._id)}" class="btn-action btn-outline">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            Message Poster
          </a>
        `;
      }

      const deleteBtnHTML = isOwner ? `
        <button class="btn-delete" onclick="deleteJob()">Delete Job</button>
      ` : '';

      const html = `
        <div class="job-card">
          <div class="job-header">
            <div class="job-title-area">
              <h1>${esc(job.title)}</h1>
              <div class="job-company">${esc(job.companyName)}</div>
            </div>
            <div class="job-icon">
              <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            </div>
          </div>

          <div class="job-tags">
            <span class="job-tag"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>${esc(job.location || 'Remote')}</span>
            <span class="job-tag"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>${esc(job.jobType)}</span>
            <span class="job-tag salary"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>${esc(job.salary)}</span>
          </div>

          <div class="section-title">Job Description</div>
          <div class="job-desc">${esc(job.description)}</div>

          ${actionButtons ? `<div class="action-area">${actionButtons}</div>` : ''}

          <div class="meta-footer">
            <div class="author-info" onclick="window.location.href='/profile.html?id=${esc(author._id)}'">
              <div class="avatar-container">${getAvatarSVG(author)}</div>
              <div class="author-text">
                <span class="author-name">${esc(author.fullName)}</span>
                <span class="post-date">Posted ${time}</span>
              </div>
            </div>
            ${deleteBtnHTML}
          </div>
        </div>
      `;
      document.getElementById('mainContainer').innerHTML = html;
    }

    async function deleteJob() {
      if (!confirm('Are you sure you want to delete this job?')) return;
      try {
        const res = await fetch(`/api/jobs/${jobId}`, { method: 'DELETE', credentials: 'include' });
        if (res.ok) {
          window.location.href = '/jobs.html';
        } else {
          alert('Failed to delete job. Make sure you are the owner.');
        }
      } catch (err) {
        alert('Error deleting job.');
      }
    }

    init();
  </script>
</body>
</html>
