<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details - PortFive</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --text: #09090B;
      --text-muted: #71717A; --line: #E4E4E7;
      --primary: #18181B; --primary-hover: #27272A;
      --accent: #6366F1; --accent-light: #EEF2FF;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); padding-bottom: 40px; }
    .top-nav { position: sticky; top: 0; z-index: 100; background: rgba(250, 250, 250, 0.98); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; gap: 15px; }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--text); display: flex; align-items: center; padding: 6px; border-radius: 50%; }
    .back-btn:hover { background: var(--line); }
    .back-btn svg { width: 22px; height: 22px; stroke-width: 2; stroke: currentColor; fill: none; }
    .nav-title { font-family: 'Archivo', sans-serif; font-size: 1.2rem; font-weight: 700; }
    
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .job-card-main { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    
    .job-title { font-family: 'Archivo', sans-serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .job-company { font-size: 1rem; color: var(--text-muted); margin-bottom: 16px; }
    .job-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
    .job-tag { font-size: 0.8rem; font-weight: 600; padding: 6px 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
    .job-tag.salary { background: var(--accent-light); color: var(--accent); border-color: #C7D2FE; }
    
    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    .job-desc { font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; margin-bottom: 24px; color: var(--text); }
    
    .apply-link-btn { display: inline-block; background: var(--surface); border: 1px solid var(--line); padding: 12px 20px; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 600; margin-bottom: 24px; width: 100%; text-align: center; }
    .apply-link-btn:hover { background: var(--bg); }
    
    .msg-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    .msg-box textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-height: 100px; font-family: inherit; font-size: 0.95rem; margin-bottom: 12px; resize: vertical; outline: none; }
    .msg-box textarea:focus { border-color: var(--primary); }
    .btn-send { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
    .btn-send:hover { background: var(--primary-hover); }
    .btn-send:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .uploader-info { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--text-muted); }
    .uploader-avatar { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; background: #E4E4E7; }
  </style>
</head>
<body>
  <div class="top-nav">
    <button class="back-btn" onclick="window.location.href='/jobs.html'">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="nav-title">Job Details</div>
  </div>

  <div class="container" id="jobContainer">
    <div style="text-align:center; padding: 40px;">Loading job details...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get('id');
    let currentUserId = null;
    let hasApplied = false;

    function esc(value) {
      return String(value === null || value === undefined ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeUrl(url) {
      return String(url || '').replace(/'/g, '%27').replace(/"/g, '%22').replace(/\(/g, '%28').replace(/\)/g, '%29').replace(/\s/g, '%20');
    }
    function getAvatarSVG(user) {
      if (user && user.profilePic) return `<div style="width:100%; height:100%; background-image:url('${safeUrl(user.profilePic)}'); background-size:cover; background-position:center;"></div>`;
      const first = user && user.fullName ? Array.from(String(user.fullName).trim())[0] : '';
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" shape-rendering="geometricPrecision"><rect width="100" height="100" fill="#E4E4E7"/><text x="50" y="50" font-size="46" font-family="'Inter', Arial, sans-serif" font-weight="700" fill="#09090B" text-anchor="middle" dominant-baseline="central">${esc((first || 'U').toUpperCase())}</text></svg>`;
    }

    async function init() {
      if (!jobId) return window.location.href = '/jobs.html';

      try {
        const userRes = await fetch('/api/auth/me', { credentials: 'include' });
        if (userRes.ok) {
          const data = await userRes.json();
          currentUserId = data.user.id || data.user._id;
        }

        const res = await fetch(`/api/jobs/${jobId}`, { credentials: 'include' });
        if (!res.ok) throw new Error('Job not found');
        const job = await res.json();
        const author = job.author || {};
        const isOwner = author._id === currentUserId;

        if (!isOwner && currentUserId) {
          const appliedRes = await fetch(`/api/jobs/${jobId}/applied`, { credentials: 'include' });
          if (appliedRes.ok) {
            const appliedData = await appliedRes.json();
            hasApplied = appliedData.hasApplied;
          }
        }

        let boxTitle = 'Contact Uploader';
        let boxDesc = 'Write a message instead of opening a chat.';
        let actionHtml = '';

        if (isOwner) {
          boxTitle = 'Applications Received';
          boxDesc = 'View messages from users who applied to this post.';
          actionHtml = `
            <button class="btn-send" style="background:var(--bg); color:var(--text); border:1px solid var(--line);" onclick="window.location.href='/job-messages.html'">
              View All Applications
            </button>
          `;
        } else if (hasApplied) {
          actionHtml = `<div style="text-align:center; color:var(--accent); font-weight:600; padding:12px;">You have already sent a message for this job.</div>`;
        } else {
          actionHtml = `
            <textarea id="applyMessage" placeholder="Write your message... You can share your work links, portfolio, or tell about yourself."></textarea>
            <button class="btn-send" id="sendBtn" onclick="sendMessage()">Send Message</button>
          `;
        }

        document.getElementById('jobContainer').innerHTML = `
          <div class="job-card-main">
            <div class="job-title">${esc(job.title)}</div>
            <div class="job-company">${esc(job.companyName)}</div>
            
            <div class="job-tags">
              <span class="job-tag">${esc(job.location || 'Remote')}</span>
              <span class="job-tag">${esc(job.jobType)}</span>
              <span class="job-tag salary">${esc(job.salary || 'Negotiable')}</span>
            </div>

            <div class="section-title">Job Description</div>
            <div class="job-desc">${esc(job.description)}</div>

            ${job.applyLink ? `<a href="${esc(job.applyLink)}" target="_blank" class="apply-link-btn">Apply Externally</a>` : ''}

            <div class="uploader-info">
              <div class="uploader-avatar">${getAvatarSVG(author)}</div>
              <span>Posted by <strong>${esc(author.fullName || 'Unknown')}</strong></span>
            </div>
          </div>

          <div class="msg-box">
            <div class="section-title">${boxTitle}</div>
            <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">${boxDesc}</p>
            ${actionHtml}
          </div>
        `;

      } catch (err) {
        document.getElementById('jobContainer').innerHTML = `<div style="text-align:center; color:var(--red);">Failed to load job details.</div>`;
      }
    }

    async function sendMessage() {
      const textarea = document.getElementById('applyMessage');
      const message = textarea.value.trim();
      if (!message) return alert('Please write a message first');

      const btn = document.getElementById('sendBtn');
      btn.innerText = 'Sending...';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/jobs/${jobId}/apply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        
        if (res.ok) {
          window.location.reload();
        } else {
          alert(data.message || 'Failed to send message');
          btn.innerText = 'Send Message';
          btn.disabled = false;
        }
      } catch (err) {
        alert('Server error');
        btn.innerText = 'Send Message';
        btn.disabled = false;
      }
    }

    init();
  </script>
</body>
</html>
