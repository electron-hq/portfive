<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Home - PortFive</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FAFAFA">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #FAFAFA; --surface: #FFFFFF; --text: #09090B; 
      --text-muted: #71717A; --line: #E4E4E7; 
      --primary: #18181B; --primary-hover: #27272A; 
      --accent: #6366F1; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 70px; color: var(--text); }

    /* Top Navbar */
    .top-nav { position: sticky; top: 0; z-index: 100; background: rgba(250, 250, 250, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .nav-icons { display: flex; gap: 15px; }
    .icon-btn { background: none; border: none; cursor: pointer; color: var(--text); }
    .icon-btn svg { width: 24px; height: 24px; stroke-width: 2; stroke: currentColor; fill: none; }

    /* Container */
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }

    /* Create Post Box */
    .create-post-box { background: var(--surface); padding: 15px; border-radius: 12px; border: 1px solid var(--line); display: flex; align-items: center; gap: 12px; margin-bottom: 20px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.02); transition: border-color 0.2s; }
    .create-post-box:hover { border-color: #D4D4D8; }
    .create-post-box .avatar-container { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .create-post-box .input-fake { flex: 1; background: var(--bg); padding: 12px; border-radius: 999px; color: var(--text-muted); font-size: 0.95rem; border: 1px solid transparent; }

    /* Global Empty State */
    .global-empty-state { display: none; text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .global-empty-state .icon-wrapper { width: 80px; height: 80px; background: var(--surface); color: var(--text); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; border: 1px solid var(--line); }
    .global-empty-state .icon-wrapper svg { width: 36px; height: 36px; stroke-width: 1.5; }
    .global-empty-state h2 { color: var(--text); font-size: 1.2rem; margin-bottom: 8px; letter-spacing: -0.5px; }
    .global-empty-state p { font-size: 0.95rem; margin-bottom: 25px; }
    .btn-start { background: var(--primary); color: white; padding: 12px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 0.95rem; display: inline-block; }

    /* Section Styles */
    .section { margin-bottom: 25px; display: none; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-title { font-size: 1.1rem; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
    .see-all { font-size: 0.85rem; color: var(--accent); font-weight: 600; cursor: pointer; }

    /* Horizontal Scroll */
    .h-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .h-scroll::-webkit-scrollbar { display: none; }

    /* Card UI */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }

    /* Follow Card */
    .follow-card { width: 130px; padding: 15px; text-align: center; }
    .follow-card .avatar-container { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; margin: 0 auto 10px; }
    .follow-card .name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .follow-card .username { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px; }
    .btn-follow { width: 100%; background: var(--primary); color: white; border: none; padding: 6px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }

    /* Video Card */
    .video-card { width: 220px; }
    .video-thumb { width: 100%; height: 120px; background: #000; position: relative; }
    .video-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
    .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; }
    .video-info { padding: 10px; }
    .video-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .video-author { font-size: 0.75rem; color: var(--text-muted); }

    /* Pen Card */
    .pen-card { width: 260px; display: flex; flex-direction: column; }
    .pen-cover { width: 100%; height: 90px; background: #F4F4F5; background-size: cover; background-position: center; border-bottom: 1px solid var(--line); }
    .pen-info { padding: 12px; }
    .pen-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -0.3px; }
    .pen-snippet { font-size: 0.8rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
    .pen-author { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 600; }
    .pen-author .avatar-sm { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; }

    /* Image Grid */
    .image-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .img-card { width: 100%; aspect-ratio: 1; border-radius: 8px; background: #F4F4F5; background-size: cover; background-position: center; position: relative; border: 1px solid var(--line); }
    
    /* Job List */
    .job-list { display: flex; flex-direction: column; gap: 10px; }
    .job-card { background: var(--surface); padding: 15px; border-radius: 12px; border: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
    .job-icon { width: 40px; height: 40px; border-radius: 8px; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
    .job-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; }
    .job-details { flex: 1; }
    .job-title { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.3px; }
    .job-company { font-size: 0.8rem; color: var(--text-muted); }
    .job-type { font-size: 0.7rem; background: var(--bg); padding: 2px 8px; border-radius: 4px; font-weight: 600; border: 1px solid var(--line); }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(250, 250, 250, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 65px; z-index: 1000; max-width: 600px; margin: 0 auto; }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 0.58rem; font-weight: 600; gap: 4px; transition: 0.2s; }
    .nav-item.active { color: var(--text); }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
    .nav-item.profile-nav .profile-pic { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="logo">Port<span>Five</span></div>
    <div class="nav-icons">
      <button class="icon-btn" onclick="window.location.href='/chat.html'">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <button class="icon-btn">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </button>
    </div>
  </div>

  <div class="container">
    <div class="create-post-box" onclick="window.location.href='/create-post.html'">
      <div class="avatar-container" id="userAvatarContainer"></div>
      <div class="input-fake">What's on your mind?</div>
    </div>

    <div class="global-empty-state" id="globalEmptyState">
      <div class="icon-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </div>
      <h2>It's a bit quiet here</h2>
      <p>Be the first to share an image, write a pen, or post a job.</p>
      <a href="/create-post.html" class="btn-start">Create a Post</a>
    </div>

    <div class="section" id="section-follow">
      <div class="section-header"><div class="section-title">Who to Follow</div></div>
      <div class="h-scroll" id="followContainer"></div>
    </div>

    <div class="section" id="section-video">
      <div class="section-header"><div class="section-title">Top Videos</div><div class="see-all" onclick="window.location.href='/videos.html'">See All</div></div>
      <div class="h-scroll" id="videoContainer"></div>
    </div>

    <div class="section" id="section-pen">
      <div class="section-header"><div class="section-title">Top Pens</div><div class="see-all" onclick="window.location.href='/pens.html'">See All</div></div>
      <div class="h-scroll" id="penContainer"></div>
    </div>

    <div class="section" id="section-image">
      <div class="section-header"><div class="section-title">Top Images</div><div class="see-all" onclick="window.location.href='/images.html'">See All</div></div>
      <div class="image-grid" id="imageContainer"></div>
    </div>

    <div class="section" id="section-job">
      <div class="section-header"><div class="section-title">Latest Jobs</div><div class="see-all" onclick="window.location.href='/jobs.html'">See All</div></div>
      <div class="job-list" id="jobContainer"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>Jobs</a>
    <a href="/pens.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Pens</a>
    <a href="/home.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home</a>
    <a href="/images.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>Images</a>
    <a href="/profile.html" class="nav-item profile-nav"><div class="profile-pic" id="navProfilePicContainer"></div></a>
  </div>

  <script>
    function getAvatarSVG(user) {
      if (user.profilePic) return `<div style="width:100%; height:100%; background-image:url('${user.profilePic}'); background-size:cover; background-position:center;"></div>`;
      const initial = user.fullName ? user.fullName.charAt(0).toUpperCase() : 'U';
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%; display:block;"><circle cx="50" cy="50" r="50" fill="#E4E4E7" /><text x="50" y="54" font-size="45" font-family="'Inter', Arial, sans-serif" font-weight="700" fill="#09090B" text-anchor="middle" dominant-baseline="middle">${initial}</text></svg>`;
    }

    function getYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function init() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          const u = data.user;
          document.getElementById('userAvatarContainer').innerHTML = getAvatarSVG(u);
          document.getElementById('navProfilePicContainer').innerHTML = getAvatarSVG(u);
        } else { window.location.href = '/login.html'; }
      } catch (err) { window.location.href = '/login.html'; }
    }
    init();

    async function loadHomepageData() {
      try {
        const [followRes, videoRes, penRes, imageRes, jobRes] = await Promise.all([
          fetch('/api/users/suggested', { credentials: 'include' }),
          fetch('/api/posts/top/video', { credentials: 'include' }),
          fetch('/api/posts/top/pen', { credentials: 'include' }),
          fetch('/api/posts/top/image', { credentials: 'include' }),
          fetch('/api/jobs/top', { credentials: 'include' })
        ]);

        const followUsers = await followRes.json();
        const videos = await videoRes.json();
        const pens = await penRes.json();
        const images = await imageRes.json();
        const jobs = await jobRes.json();

        const isEverythingEmpty = (!followUsers || followUsers.length === 0) && (!videos || videos.length === 0) && (!pens || pens.length === 0) && (!images || images.length === 0) && (!jobs || jobs.length === 0);

        if (isEverythingEmpty) {
          document.getElementById('globalEmptyState').style.display = 'block';
        } else {
          document.getElementById('globalEmptyState').style.display = 'none';
          renderFollow(followUsers);
          renderVideos(videos);
          renderPens(pens);
          renderImages(images);
          renderJobs(jobs);
        }
      } catch (err) { console.error(err); }
    }

    function renderFollow(users) {
      if (!users || users.length === 0) return;
      document.getElementById('section-follow').style.display = 'block';
      document.getElementById('followContainer').innerHTML = users.map(u => `
        <div class="card follow-card">
          <div class="avatar-container">${getAvatarSVG(u)}</div>
          <div class="name">${u.fullName}</div>
          <div class="username">@${u.username}</div>
          <button class="btn-follow">Follow</button>
        </div>
      `).join('');
    }

    function renderVideos(videos) {
      if (!videos || videos.length === 0) return;
      document.getElementById('section-video').style.display = 'block';
      document.getElementById('videoContainer').innerHTML = videos.map(v => {
        const ytId = getYouTubeID(v.mediaUrl);
        const thumbUrl = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : v.mediaUrl;
        return `
          <div class="card video-card" onclick="window.location.href='/post.html?id=${v._id}'">
            <div class="video-thumb">
              <img src="${thumbUrl}" onerror="this.src='https://via.placeholder.com/300x200/0F172A/ffffff?text=Video'">
              <div class="play-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div>
            </div>
            <div class="video-info">
              <div class="video-title">${v.caption || 'Watch Video'}</div>
              <div class="video-author">@${v.author.username}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderPens(pens) {
      if (!pens || pens.length === 0) return;
      document.getElementById('section-pen').style.display = 'block';
      document.getElementById('penContainer').innerHTML = pens.map(p => `
        <div class="card pen-card" onclick="window.location.href='/post.html?id=${p._id}'">
          ${p.mediaUrl ? `<div class="pen-cover" style="background-image:url('${p.mediaUrl}')"></div>` : ''}
          <div class="pen-info">
            <div class="pen-title">${p.title || 'Untitled Article'}</div>
            <div class="pen-snippet">${p.content.substring(0, 80)}...</div>
            <div class="pen-author"><div class="avatar-sm">${getAvatarSVG(p.author)}</div> @${p.author.username}</div>
          </div>
        </div>
      `).join('');
    }

    function renderImages(images) {
      if (!images || images.length === 0) return;
      document.getElementById('section-image').style.display = 'block';
      document.getElementById('imageContainer').innerHTML = images.map(img => `
        <div class="img-card" style="background-image:url('${img.mediaUrl}')" onclick="window.location.href='/post.html?id=${img._id}'"></div>
      `).join('');
    }

    function renderJobs(jobs) {
      if (!jobs || jobs.length === 0) return;
      document.getElementById('section-job').style.display = 'block';
      document.getElementById('jobContainer').innerHTML = jobs.map(j => `
        <div class="job-card" onclick="window.location.href='/job.html?id=${j._id}'">
          <div class="job-icon"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg></div>
          <div class="job-details">
            <div class="job-title">${j.title}</div>
            <div class="job-company">${j.companyName} • ${j.location}</div>
          </div>
          <div class="job-type">${j.jobType}</div>
        </div>
      `).join('');
    }

    loadHomepageData();
  </script>
</body>
</html>
