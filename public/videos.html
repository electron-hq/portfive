<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos - PortFive</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FAFAFA">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --text: #09090B;
      --text-muted: #71717A; --line: #E4E4E7;
      --primary: #18181B; --primary-hover: #27272A;
      --accent: #6366F1; --accent-light: #EEF2FF;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 85px; color: var(--text); -webkit-font-smoothing: antialiased; }

    /* Top Navbar */
    .top-nav { position: sticky; top: 0; z-index: 100; background: rgba(250, 250, 250, 0.98); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .nav-title { font-family: 'Archivo', sans-serif; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }
    .icon-btn { background: none; border: none; cursor: pointer; color: var(--text); padding: 6px; border-radius: 50%; transition: 0.2s; display: flex; text-decoration: none;}
    .icon-btn:hover { background: var(--line); }
    .icon-btn svg { width: 22px; height: 22px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* Container */
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* Search Bar */
    .search-wrap { position: relative; margin-bottom: 20px; }
    .search-input { width: 100%; padding: 14px 16px 14px 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 0.95rem; font-family: inherit; color: var(--text); outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: var(--text-muted); fill: none; stroke-width: 2; }

    /* Video List (YouTube Style) */
    .video-list { display: flex; flex-direction: column; gap: 20px; }

    .video-card { cursor: pointer; transition: transform 0.2s; }
    .video-card:hover { transform: translateY(-2px); }

    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(9,9,11,0.05);
    }
    .thumbnail-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      pointer-events: none;
    }
    .play-icon svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-left: 3px; }
    
    .video-info { display: flex; gap: 12px; margin-top: 12px; }
    .author-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #E4E4E7; cursor: pointer; }
    .author-avatar svg { display: block; width: 100%; height: 100%; }
    
    .video-details { flex: 1; min-width: 0; }
    .video-title { font-size: 1rem; font-weight: 600; line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text); }
    .video-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 2px; }
    .video-author-name { font-weight: 500; }
    .video-stats { display: flex; align-items: center; gap: 4px; }

    /* Empty State */
    .global-empty-state { display: none; text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .global-empty-state .icon-wrapper { width: 80px; height: 80px; background: var(--surface); color: var(--text); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; border: 1px solid var(--line); }
    .global-empty-state .icon-wrapper svg { width: 36px; height: 36px; stroke-width: 1.5; }
    .global-empty-state h2 { font-family: 'Archivo', sans-serif; color: var(--text); font-size: 1.2rem; margin-bottom: 8px; letter-spacing: -0.5px; }
    .global-empty-state p { font-size: 0.95rem; margin-bottom: 25px; }
    .btn-start { background: var(--primary); color: white; padding: 12px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 0.95rem; display: inline-block; }
    .btn-start:hover { background: var(--primary-hover); }

    /* Skeleton */
    .sk { background: linear-gradient(90deg, #EFEFF1 25%, #F6F6F8 50%, #EFEFF1 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite linear; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .sk-thumb { height: 200px; border-radius: 12px; margin-bottom: 12px; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(250, 250, 250, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 68px; z-index: 1000; max-width: 600px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 0.6rem; font-weight: 600; gap: 5px; transition: 0.2s; width: 60px; }
    .nav-item.active { color: var(--text); }
    .nav-item svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.profile-nav .profile-pic { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #E4E4E7; margin-top: 1px; margin-bottom: 1px; }
    .nav-item.profile-nav .profile-pic > * { width: 100%; height: 100%; }
    .nav-item.profile-nav .profile-pic svg { display: block; border-radius: 50%; stroke: none; }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="nav-title">Videos</div>
    <a href="/create-post.html" class="icon-btn" aria-label="Create Video">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </a>
  </div>

  <div class="container">
    <!-- Search Bar -->
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search videos..." autocomplete="off">
    </div>

    <div class="video-list" id="videoContainer">
      <div class="sk sk-thumb"></div>
      <div class="sk sk-thumb"></div>
    </div>

    <div class="global-empty-state" id="globalEmptyState">
      <div class="icon-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
      </div>
      <h2>No videos yet</h2>
      <p>Be the first to share a video with everyone!</p>
      <a href="/create-post.html" class="btn-start">Post a Video</a>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>Jobs</a>
    <a href="/pens.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Pens</a>
    <a href="/home.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home</a>
    <a href="/images.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>Images</a>
    <a href="/profile.html" class="nav-item profile-nav"><div class="profile-pic" id="navProfilePic"></div></a>
  </div>

  <script>
    let allVideos = []; // Store fetched videos for client-side filtering

    function esc(value) {
      return String(value === null || value === undefined ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeUrl(url) {
      return String(url || '').replace(/'/g, '%27').replace(/"/g, '%22').replace(/\(/g, '%28').replace(/\)/g, '%29').replace(/\s/g, '%20');
    }
    function getAvatarSVG(user) {
      if (user && user.profilePic) return `<div style="width:100%; height:100%; background-image:url('${safeUrl(user.profilePic)}'); background-size:cover; background-position:center;"></div>`;
      const first = user && user.fullName ? Array.from(String(user.fullName).trim())[0] : '';
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" shape-rendering="geometricPrecision"><rect width="100" height="100" fill="#E4E4E7"/><text x="50" y="50" font-size="46" font-family="'Inter', Arial, sans-serif" font-weight="700" fill="#09090B" text-anchor="middle" dominant-baseline="central">${esc((first || 'U').toUpperCase())}</text></svg>`;
    }
    function getYouTubeID(rawUrl) {
      try {
        const u = new URL(String(rawUrl || '').trim());
        const host = u.hostname.replace(/^www\./, '').replace(/^m\./, '');
        let id = null;
        if (host === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
        else if (host === 'youtube.com' || host === 'music.youtube.com') {
          if (u.pathname === '/watch') id = u.searchParams.get('v');
          else { const m = u.pathname.match(/^\/(embed|shorts|v|live)\/([^/?#]+)/); if (m) id = m[2]; }
        }
        return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
      } catch (e) { return null; }
    }
    function timeAgo(dateString) {
      if (!dateString) return 'Just now';
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      if (seconds < 60) return 'Just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h ago';
      const days = Math.floor(hours / 24);
      if (days < 7) return days + 'd ago';
      return date.toLocaleDateString();
    }
    function formatCount(num) {
      if (!num) return 0;
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return num;
    }

    async function init() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          const navPic = document.getElementById('navProfilePic');
          if (data.user.profilePic) {
            navPic.style.backgroundImage = `url('${safeUrl(data.user.profilePic)}')`;
            navPic.style.backgroundSize = 'cover';
            navPic.style.backgroundPosition = 'center';
          } else {
            navPic.innerHTML = getAvatarSVG(data.user);
          }
          loadVideos();
        } else { window.location.href = '/login.html'; }
      } catch (err) { window.location.href = '/login.html'; }
    }

    async function loadVideos() {
      const container = document.getElementById('videoContainer');
      try {
        const res = await fetch('/api/posts/top/video', { credentials: 'include' });
        allVideos = await res.json();
        
        renderVideos(allVideos);

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div style="text-align:center; color:var(--red); padding:20px;">Failed to load videos.</div>';
      }
    }

    function renderVideos(videosToRender) {
      const container = document.getElementById('videoContainer');
      const emptyState = document.getElementById('globalEmptyState');

      if (!videosToRender || videosToRender.length === 0) {
        container.innerHTML = '';
        container.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      container.style.display = 'flex';
      emptyState.style.display = 'none';

      container.innerHTML = videosToRender.map(v => {
        const author = v.author || {};
        const ytId = getYouTubeID(v.mediaUrl);
        const thumbUrl = v.thumbnailUrl || (ytId ? 'https://img.youtube.com/vi/' + ytId + '/hqdefault.jpg' : v.mediaUrl);
        const time = timeAgo(v.createdAt);

        return `
          <div class="video-card" onclick="window.location.href='/post.html?id=${esc(v._id)}'">
            <div class="thumbnail-wrapper">
              <img src="${esc(thumbUrl)}" alt="Thumbnail">
              <div class="play-icon">
                <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
              </div>
            </div>
            
            <div class="video-info">
              <div class="author-avatar" onclick="event.stopPropagation(); window.location.href='/profile.html?id=${esc(author._id)}'">${getAvatarSVG(author)}</div>
              <div class="video-details">
                <div class="video-title">${esc(v.caption || 'Untitled Video')}</div>
                <div class="video-meta">
                  <span class="video-author-name">${esc(author.fullName || 'Unknown')}</span>
                  <span class="video-stats">${formatCount(v.views || 0)} views · ${time}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Client-side Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      
      if (!query) {
        renderVideos(allVideos);
      } else {
        const filtered = allVideos.filter(v => {
          const titleMatch = v.caption && v.caption.toLowerCase().includes(query);
          const authorMatch = v.author && v.author.fullName && v.author.fullName.toLowerCase().includes(query);
          return titleMatch || authorMatch;
        });
        renderVideos(filtered);
      }
    });

    init();
  </script>
</body>
</html>
