<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profile - PortFive</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; 
      --text-muted: #64748B; --line: #E2E8F0; --green: #10B981; 
      --green-dark: #059669; --blue: #3B82F6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 70px; }

    /* Top Navbar */
    .top-nav { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 15px; }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--text); display: flex; align-items: center; }
    .back-btn svg { width: 24px; height: 24px; stroke-width: 2; stroke: currentColor; fill: none; }
    .logo { font-family: 'Archivo', sans-serif; font-size: 1.3rem; font-weight: 800; }
    .logo span { color: var(--green); }

    /* Profile Header */
    .profile-header { background: var(--surface); border-bottom: 1px solid var(--line); max-width: 600px; margin: 0 auto; }
    .cover-pic { width: 100%; height: 180px; background: #E2E8F0; background-size: cover; background-position: center; position: relative; }
    .cover-pic::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to top, rgba(0,0,0,0.5), transparent); }
    
    .profile-info-container { padding: 0 20px 20px 20px; position: relative; }
    .avatar-wrapper { position: absolute; top: -50px; left: 20px; }
    .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--green); color: white; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; font-family: 'Archivo', sans-serif; font-weight: 700; border: 4px solid var(--surface); background-size: cover; background-position: center; }
    
    .profile-actions { display: flex; justify-content: flex-end; padding-top: 15px; margin-bottom: 10px; gap: 10px; }
    
    .btn { padding: 8px 20px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border: none; }
    .btn-primary { background: var(--green); color: white; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .btn-dark { background: var(--text); color: white; }
    
    .profile-details h1 { font-family: 'Archivo', sans-serif; font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .profile-username { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 10px; display: block; }
    .profile-bio { font-size: 1rem; margin-bottom: 15px; line-height: 1.5; }
    
    .profile-stats { display: flex; gap: 20px; font-size: 0.95rem; color: var(--text-muted); }
    .profile-stats span { font-weight: 700; color: var(--text); cursor: pointer; }
    
    .badge-icon { width: 20px; height: 20px; fill: var(--blue); }

    /* Tabs */
    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--line); max-width: 600px; margin: 0 auto; }
    .tab { flex: 1; text-align: center; padding: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--text); border-bottom-color: var(--green); }

    /* Content Area */
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Post Cards (Grid/List) */
    .post-list { display: flex; flex-direction: column; gap: 15px; }
    .post-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .post-img { width: 100%; max-height: 400px; object-fit: cover; }
    .post-info { padding: 15px; }
    .post-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; }
    .post-caption { color: var(--text-muted); font-size: 0.9rem; }
    
    /* Friends List */
    .friends-list { display: flex; flex-direction: column; gap: 10px; }
    .friend-card { background: var(--surface); padding: 15px; border-radius: 12px; border: 1px solid var(--line); display: flex; align-items: center; gap: 15px; cursor: pointer; }
    .friend-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--green); color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; background-size: cover; background-position: center; }
    .friend-info h4 { font-size: 1rem; display: flex; align-items: center; gap: 5px; }
    .friend-info p { color: var(--text-muted); font-size: 0.85rem; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 65px; z-index: 1000; max-width: 600px; margin: 0 auto; }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 0.58rem; font-weight: 600; gap: 4px; }
    .nav-item.active { color: var(--green); }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
    .nav-item.profile-nav .profile-pic { width: 24px; height: 24px; border-radius: 50%; background: #ccc; background-size: cover; border: 2px solid transparent; }
    .nav-item.profile-nav.active .profile-pic { border-color: var(--green); }
  </style>
</head>
<body>

  <div class="top-nav">
    <button class="back-btn" onclick="window.history.back()">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="logo">Pro<span>file</span></div>
  </div>

  <div class="profile-header">
    <div class="cover-pic" id="coverPic"></div>
    <div class="profile-info-container">
      <div class="avatar-wrapper">
        <div class="profile-avatar" id="profileAvatar">U</div>
      </div>
      <div class="profile-actions" id="profileActions">
        <!-- Buttons injected via JS -->
      </div>
      <div class="profile-details">
        <h1 id="profileName">Loading...</h1>
        <span class="profile-username" id="profileUsername">@loading</span>
        <p class="profile-bio" id="profileBio"></p>
        <div class="profile-stats">
          <div><span id="statFriends">0</span> Friends</div>
          <div><span id="statFollowing">0</span> Following</div>
        </div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-posts" onclick="switchTab('posts')">Posts</div>
    <div class="tab" id="tab-friends" onclick="switchTab('friends')">Friends</div>
    <div class="tab" id="tab-saved" onclick="switchTab('saved')" style="display:none;">Saved</div>
  </div>

  <div class="container">
    <div class="tab-content active" id="content-posts"></div>
    <div class="tab-content" id="content-friends"></div>
    <div class="tab-content" id="content-saved"></div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
      Jobs
    </a>
    <a href="/pens.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
      Pens
    </a>
    <a href="/home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Home
    </a>
    <a href="/images.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      Images
    </a>
    <a href="/profile.html" class="nav-item profile-nav active">
      <div class="profile-pic" id="navProfilePic"></div>
    </a>
  </div>

  <script>
    let currentUser = null;
    let targetUserId = null;
    let profileData = null;

    const urlParams = new URLSearchParams(window.location.search);
    targetUserId = urlParams.get('id');

    async function init() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        currentUser = data.user;

        if (!targetUserId) targetUserId = currentUser.id;

        // Nav Avatar
        const navPic = document.getElementById('navProfilePic');
        if (currentUser.profilePic) navPic.style.backgroundImage = `url(${currentUser.profilePic})`;

        await loadProfile();
      } catch (err) {
        window.location.href = '/login.html';
      }
    }

    async function loadProfile() {
      try {
        const res = await fetch(`/api/users/profile/${targetUserId}`, { credentials: 'include' });
        if (!res.ok) throw new Error();
        profileData = await res.json();
        
        renderProfile();
        loadPosts();
        loadFriends();
        
        if (currentUser.id === targetUserId) {
          document.getElementById('tab-saved').style.display = 'block';
          loadSavedPosts();
        }
      } catch (err) {
        alert('Failed to load profile');
      }
    }

    function renderProfile() {
      const u = profileData.user;
      document.getElementById('profileName').innerHTML = `${u.fullName} ${u.badge ? `<svg class="badge-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>` : ''}`;
      document.getElementById('profileUsername').innerText = `@${u.username}`;
      document.getElementById('profileBio').innerText = u.bio || '';
      
      document.getElementById('statFriends').innerText = profileData.followersCount;
      document.getElementById('statFollowing').innerText = profileData.followingCount;

      const avatar = document.getElementById('profileAvatar');
      if (u.profilePic) {
        avatar.style.backgroundImage = `url(${u.profilePic})`;
        avatar.innerText = '';
      } else {
        avatar.innerText = u.fullName.charAt(0).toUpperCase();
      }

      const actions = document.getElementById('profileActions');
      if (currentUser.id === targetUserId) {
        actions.innerHTML = `<a href="/settings.html" class="btn btn-outline">Edit Profile</a>`;
      } else {
        const followText = profileData.isFollowing ? 'Unfollow' : 'Follow';
        const followClass = profileData.isFollowing ? 'btn-outline' : 'btn-primary';
        actions.innerHTML = `
          <button class="btn ${followClass}" onclick="toggleFollow()" id="followBtn">${followText}</button>
          <a href="/chat-room.html?id=${u._id}" class="btn btn-dark">Message</a>
        `;
      }
    }

    async function toggleFollow() {
      const btn = document.getElementById('followBtn');
      const isFollowing = profileData.isFollowing;
      const endpoint = isFollowing ? '/api/users/unfollow/' : '/api/users/follow/';
      
      try {
        const res = await fetch(`${endpoint}${targetUserId}`, { method: 'POST', credentials: 'include' });
        if (res.ok) {
          profileData.isFollowing = !isFollowing;
          if (profileData.isFollowing) profileData.followersCount++;
          else profileData.followersCount--;
          renderProfile();
        }
      } catch (err) {}
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      document.getElementById(`tab-${tab}`).classList.add('active');
      document.getElementById(`content-${tab}`).classList.add('active');
    }

    async function loadPosts() {
      const container = document.getElementById('content-posts');
      try {
        const res = await fetch(`/api/posts/user/${targetUserId}`, { credentials: 'include' });
        const posts = await res.json();
        
        if (posts.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No posts yet.</p>';
          return;
        }

        container.innerHTML = `<div class="post-list">` + posts.map(p => `
          <div class="post-card">
            ${p.mediaUrl && p.postType === 'image' ? `<img src="${p.mediaUrl}" class="post-img">` : ''}
            <div class="post-info">
              ${p.postType === 'pen' ? `<div class="post-title">${p.title}</div>` : ''}
              <div class="post-caption">${p.postType === 'pen' ? p.content.substring(0,100)+'...' : (p.caption || '')}</div>
            </div>
          </div>
        `).join('') + `</div>`;
      } catch (err) {
        container.innerHTML = '<p>Failed to load posts.</p>';
      }
    }

    async function loadFriends() {
      const container = document.getElementById('content-friends');
      try {
        const res = await fetch(`/api/users/friends/${targetUserId}`, { credentials: 'include' });
        const friends = await res.json();
        
        if (friends.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No friends yet.</p>';
          return;
        }

        container.innerHTML = `<div class="friends-list">` + friends.map(f => `
          <div class="friend-card" onclick="window.location.href='/profile.html?id=${f._id}'">
            <div class="friend-avatar" style="${f.profilePic ? `background-image:url('${f.profilePic}')` : ''}">${f.profilePic ? '' : f.fullName.charAt(0)}</div>
            <div class="friend-info">
              <h4>${f.fullName} ${f.badge ? '✓' : ''}</h4>
              <p>@${f.username}</p>
            </div>
          </div>
        `).join('') + `</div>`;
      } catch (err) {}
    }

    async function loadSavedPosts() {
      const container = document.getElementById('content-saved');
      try {
        const res = await fetch(`/api/users/saved/${targetUserId}`, { credentials: 'include' });
        const posts = await res.json();
        
        if (!posts || posts.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No saved posts.</p>';
          return;
        }

        container.innerHTML = `<div class="post-list">` + posts.map(p => `
          <div class="post-card">
             ${p.mediaUrl && p.postType === 'image' ? `<img src="${p.mediaUrl}" class="post-img">` : ''}
             <div class="post-info">
               ${p.postType === 'pen' ? `<div class="post-title">${p.title}</div>` : ''}
               <div class="post-caption">${p.postType === 'pen' ? p.content.substring(0,100)+'...' : (p.caption || '')}</div>
             </div>
          </div>
        `).join('') + `</div>`;
      } catch (err) {}
    }

    init();
  </script>
</body>
</html>
