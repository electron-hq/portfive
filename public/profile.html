<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profile - PortFive</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --text: #09090B;
      --text-muted: #71717A; --line: #E4E4E7;
      --primary: #18181B; --primary-hover: #27272A;
      --accent: #6366F1; --accent-light: #EEF2FF;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 70px; color: var(--text); }

    /* Top Navbar */
    .top-nav { position: sticky; top: 0; z-index: 100; background: rgba(250, 250, 250, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .nav-left { display: flex; align-items: center; gap: 15px; }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--text); display: flex; align-items: center; padding: 5px; border-radius: 50%; transition: 0.2s; }
    .back-btn:hover { background: var(--line); }
    .back-btn svg { width: 24px; height: 24px; stroke-width: 2; stroke: currentColor; fill: none; }
    .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }

    /* Settings Icon */
    .settings-btn { background: none; border: none; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 50%; transition: 0.2s; }
    .settings-btn:hover { background: var(--line); }
    .settings-btn svg { width: 22px; height: 22px; stroke-width: 2; stroke: currentColor; fill: none; transition: transform 0.3s ease; }
    .settings-btn:hover svg { transform: rotate(90deg); }

    /* Profile Header */
    .profile-header { background: var(--surface); border-bottom: 1px solid var(--line); max-width: 600px; margin: 0 auto; }
    .cover-pic { width: 100%; height: 160px; background: #E4E4E7; background-size: cover; background-position: center; position: relative; }
    .cover-pic::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to top, rgba(0,0,0,0.05), transparent); pointer-events: none; }

    /* Camera Edit Buttons */
    .edit-btn { position: absolute; background: rgba(24, 24, 27, 0.6); border: none; border-radius: 50%; display: none; justify-content: center; align-items: center; cursor: pointer; z-index: 5; transition: 0.2s; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .edit-btn:hover { background: rgba(24, 24, 27, 0.9); transform: scale(1.05); }
    .edit-btn svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 2; }

    .cover-edit-btn { top: 15px; right: 15px; padding: 8px; }
    .avatar-edit-btn { bottom: 0; right: 0; padding: 7px; border: 2px solid var(--surface); background: var(--primary); }

    .profile-info-container { padding: 0 20px 20px 20px; position: relative; }
    .avatar-wrapper { position: absolute; top: -50px; left: 20px; z-index: 2; }

    /* Avatar: outer ring (overflow visible for the camera button) + inner circular clip */
    .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--surface); border: 4px solid var(--surface); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: relative; }
    .avatar-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #E4E4E7; }
    .avatar-inner svg { display: block; width: 100%; height: 100%; border-radius: 50%; }

    .profile-actions { display: flex; justify-content: flex-end; padding-top: 15px; margin-bottom: 15px; gap: 10px; }

    .btn { padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border: none; transition: 0.2s; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .btn-outline:hover { background: var(--bg); border-color: #D4D4D8; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }

    .profile-details h1 { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; letter-spacing: -0.5px; }
    .profile-username { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 12px; display: block; }
    .profile-bio { font-size: 1rem; margin-bottom: 15px; line-height: 1.5; color: var(--text); }

    .profile-website { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; font-size: 0.9rem; text-decoration: none; margin-bottom: 15px; }
    .profile-website:hover { text-decoration: underline; }
    .profile-website svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

    .profile-stats { display: flex; gap: 20px; font-size: 0.95rem; color: var(--text-muted); }
    .profile-stats span { font-weight: 700; color: var(--text); cursor: pointer; }

    .badge-icon { width: 20px; height: 20px; fill: var(--accent); }

    /* Tabs */
    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--line); max-width: 600px; margin: 0 auto; position: sticky; top: 60px; z-index: 90; }
    .tab { flex: 1; text-align: center; padding: 15px; font-weight: 600; font-size: 0.95rem; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; }
    .tab.active { color: var(--text); border-bottom-color: var(--primary); }

    /* Content Area */
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Post Grid */
    .post-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-item { aspect-ratio: 1; background: #F4F4F5; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid var(--line); }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; }
    .grid-item .video-icon { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); border-radius: 4px; padding: 4px; display: flex; }
    .grid-item .video-icon svg { width: 14px; height: 14px; stroke: white; fill: none; }

    /* Pen List (Full Width) */
    .pen-list { display: flex; flex-direction: column; gap: 15px; }
    .pen-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; cursor: pointer; transition: 0.2s; }
    .pen-card:hover { border-color: #D4D4D8; }
    .pen-card h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.3px; }
    .pen-card p { font-size: 0.95rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 12px; line-height: 1.6; }
    .pen-card .meta { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }

    /* Friends List */
    .friends-list { display: flex; flex-direction: column; gap: 10px; }
    .friend-card { background: var(--surface); padding: 15px; border-radius: 12px; border: 1px solid var(--line); display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; }
    .friend-card:hover { border-color: #D4D4D8; }
    .friend-avatar { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #E4E4E7; }
    .friend-avatar svg { display: block; width: 100%; height: 100%; border-radius: 50%; }
    .friend-info h4 { font-size: 1rem; display: flex; align-items: center; gap: 5px; }
    .friend-info p { color: var(--text-muted); font-size: 0.85rem; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state svg { width: 48px; height: 48px; stroke: var(--line); margin-bottom: 15px; }
    .empty-state p { font-size: 0.95rem; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(250, 250, 250, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 65px; z-index: 1000; max-width: 600px; margin: 0 auto; }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 0.58rem; font-weight: 600; gap: 4px; transition: 0.2s; }
    .nav-item.active { color: var(--text); }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
    .nav-item.profile-nav .profile-pic { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 2px solid transparent; box-sizing: content-box; }
    .nav-item.profile-nav .profile-pic > * { width: 100%; height: 100%; }
    .nav-item.profile-nav .profile-pic svg { display: block; border-radius: 50%; stroke: none; }
    .nav-item.profile-nav.active .profile-pic { border-color: var(--primary); }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="nav-left">
      <button class="back-btn" onclick="window.history.back()">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <div class="logo">Pro<span>file</span></div>
    </div>
    <a href="/settings.html" class="settings-btn" title="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </a>
  </div>

  <div class="profile-header">
    <div class="cover-pic" id="coverPic">
      <button class="edit-btn cover-edit-btn" id="editCoverBtn" onclick="window.location.href='/settings.html'">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </button>
    </div>
    <div class="profile-info-container">
      <div class="avatar-wrapper">
        <div class="profile-avatar">
          <div class="avatar-inner" id="profileAvatar"></div>
          <button class="edit-btn avatar-edit-btn" id="editAvatarBtn" onclick="window.location.href='/settings.html'">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          </button>
        </div>
      </div>

      <div class="profile-actions" id="profileActions"></div>

      <div class="profile-details">
        <h1 id="profileName">Loading...</h1>
        <span class="profile-username" id="profileUsername">@loading</span>
        <p class="profile-bio" id="profileBio"></p>

        <a href="#" class="profile-website" id="profileWebsite" style="display:none;" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          <span id="websiteTitle">Visit Us!</span>
        </a>

        <div class="profile-stats">
          <div><span id="statFriends" onclick="switchTab('friends')">0</span> Friends</div>
          <div><span id="statFollowing">0</span> Following</div>
        </div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-posts" onclick="switchTab('posts')">Posts</div>
    <div class="tab" id="tab-friends" onclick="switchTab('friends')">Friends</div>
    <div class="tab" id="tab-saved" onclick="switchTab('saved')" style="display:none;">Saved</div>
  </div>

  <div class="container">
    <div class="tab-content active" id="content-posts"></div>
    <div class="tab-content" id="content-friends"></div>
    <div class="tab-content" id="content-saved"></div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>Jobs
    </a>
    <a href="/pens.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Pens
    </a>
    <a href="/home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home
    </a>
    <a href="/images.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>Images
    </a>
    <a href="/profile.html" class="nav-item profile-nav active">
      <div class="profile-pic" id="navProfilePicContainer"></div>
    </a>
  </div>

  <script>
    let currentUser = null;
    let targetUserId = null;
    let profileData = null;

    const urlParams = new URLSearchParams(window.location.search);
    targetUserId = urlParams.get('id');

    // Escape text before inserting into innerHTML (prevents XSS)
    function esc(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Make a URL safe for CSS url('...') and HTML attributes
    function safeUrl(url) {
      return String(url || '')
        .replace(/'/g, '%27')
        .replace(/"/g, '%22')
        .replace(/\(/g, '%28')
        .replace(/\)/g, '%29')
        .replace(/\s/g, '%20')
        .replace(/</g, '%3C')
        .replace(/>/g, '%3E');
    }

    // Allow only http/https links for the website button
    function isSafeHttpUrl(url) {
      return /^https?:\/\//i.test(String(url || '').trim());
    }

    // Avatar: photo (circular via parent clip) or perfect vector initial placeholder
    function getAvatarSVG(user) {
      if (user.profilePic) {
        return `<div style="width:100%; height:100%; background-image:url('${safeUrl(user.profilePic)}'); background-size:cover; background-position:center;"></div>`;
      }
      const first = user.fullName ? Array.from(String(user.fullName).trim())[0] : '';
      const initial = esc((first || 'U').toUpperCase());
      return `
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" role="img" aria-label="Avatar">
          <rect width="100" height="100" fill="#E4E4E7"/>
          <text x="50" y="50" font-size="46" font-family="'Inter', Arial, sans-serif" font-weight="700" fill="#09090B" text-anchor="middle" dominant-baseline="central">${initial}</text>
        </svg>
      `;
    }

    async function init() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        currentUser = data.user;

        if (!targetUserId) targetUserId = currentUser.id;

        document.getElementById('navProfilePicContainer').innerHTML = getAvatarSVG(currentUser);

        await loadProfile();
      } catch (err) {
        window.location.href = '/login.html';
      }
    }

    async function loadProfile() {
      try {
        const res = await fetch(`/api/users/profile/${targetUserId}`, { credentials: 'include' });
        if (!res.ok) throw new Error();
        profileData = await res.json();

        renderProfile();
        loadPosts();
        loadFriends();

        if (currentUser.id === targetUserId) {
          document.getElementById('tab-saved').style.display = 'block';
          loadSavedPosts();
        }
      } catch (err) {
        alert('Failed to load profile');
        window.location.href = '/home.html';
      }
    }

    function renderProfile() {
      const u = profileData.user;
      document.getElementById('profileName').innerHTML = `${esc(u.fullName)} ${u.badge ? `<svg class="badge-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>` : ''}`;
      document.getElementById('profileUsername').innerText = `@${u.username}`;
      document.getElementById('profileBio').innerText = u.bio || '';

      const webLink = document.getElementById('profileWebsite');
      if (u.website && u.website.url && isSafeHttpUrl(u.website.url)) {
        webLink.href = u.website.url;
        document.getElementById('websiteTitle').innerText = u.website.title || 'Visit Us!';
        webLink.style.display = 'inline-flex';
      } else {
        webLink.style.display = 'none';
      }

      document.getElementById('statFriends').innerText = profileData.followersCount;
      document.getElementById('statFollowing').innerText = profileData.followingCount;

      // Avatar (inner circular clip layer; camera button is a separate sibling)
      document.getElementById('profileAvatar').innerHTML = getAvatarSVG(u);

      if (u.coverPic) {
        document.getElementById('coverPic').style.backgroundImage = `url("${safeUrl(u.coverPic)}")`;
      }

      const actions = document.getElementById('profileActions');
      if (currentUser.id === targetUserId) {
        actions.innerHTML = `<a href="/settings.html" class="btn btn-outline">Edit Profile</a>`;
        document.getElementById('editCoverBtn').style.display = 'flex';
        document.getElementById('editAvatarBtn').style.display = 'flex';
      } else {
        const followText = profileData.isFollowing ? 'Unfollow' : 'Follow';
        const followClass = profileData.isFollowing ? 'btn-outline' : 'btn-primary';
        actions.innerHTML = `
          <button class="btn ${followClass}" onclick="toggleFollow()" id="followBtn">${followText}</button>
          <a href="/chat-room.html?id=${esc(u._id)}" class="btn btn-outline">
            <svg viewBox="0 0 24 24" style="width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            Message
          </a>
        `;
      }
    }

    async function toggleFollow() {
      const isFollowing = profileData.isFollowing;
      const endpoint = isFollowing ? '/api/users/unfollow/' : '/api/users/follow/';

      try {
        const res = await fetch(`${endpoint}${targetUserId}`, { method: 'POST', credentials: 'include' });
        if (res.ok) {
          profileData.isFollowing = !isFollowing;
          if (profileData.isFollowing) profileData.followersCount++;
          else profileData.followersCount--;
          renderProfile();
        }
      } catch (err) {}
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      document.getElementById(`tab-${tab}`).classList.add('active');
      document.getElementById(`content-${tab}`).classList.add('active');
    }

    async function loadPosts() {
      const container = document.getElementById('content-posts');
      try {
        const res = await fetch(`/api/posts/user/${targetUserId}`, { credentials: 'include' });
        const posts = await res.json();

        if (posts.length === 0) {
          container.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <p>No posts yet.</p>
          </div>`;
          return;
        }

        const mediaPosts = posts.filter(p => p.postType === 'image' || p.postType === 'video');
        const penPosts = posts.filter(p => p.postType === 'pen');

        let html = '';

        if (penPosts.length > 0) {
          html += `<div class="pen-list">`;
          html += penPosts.map(p => `
            <div class="pen-card" onclick="window.location.href='/post.html?id=${esc(p._id)}'">
              <h3>${esc(p.title)}</h3>
              <p>${esc(p.content)}</p>
              <div class="meta">Read Article</div>
            </div>
          `).join('');
          html += `</div>`;
        }

        if (mediaPosts.length > 0) {
          html += `<div class="post-grid" style="margin-top: ${penPosts.length > 0 ? '20px' : '0'};">`;
          html += mediaPosts.map(p => `
            <div class="grid-item" onclick="window.location.href='/post.html?id=${esc(p._id)}'">
              <img src="${esc(p.mediaUrl)}" onerror="this.style.display='none'">
              ${p.postType === 'video' ? `<div class="video-icon"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div>` : ''}
            </div>
          `).join('');
          html += `</div>`;
        }

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<p style="text-align:center; color:var(--red);">Failed to load posts.</p>`;
      }
    }

    async function loadFriends() {
      const container = document.getElementById('content-friends');
      try {
        const res = await fetch(`/api/users/friends/${targetUserId}`, { credentials: 'include' });
        const friends = await res.json();

        if (friends.length === 0) {
          container.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <p>No friends yet.</p>
          </div>`;
          return;
        }

        container.innerHTML = `<div class="friends-list">` + friends.map(f => `
          <div class="friend-card" onclick="window.location.href='/profile.html?id=${esc(f._id)}'">
            <div class="friend-avatar">${getAvatarSVG(f)}</div>
            <div class="friend-info">
              <h4>${esc(f.fullName)} ${f.badge ? `<svg class="badge-icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>` : ''}</h4>
              <p>@${esc(f.username)}</p>
            </div>
          </div>
        `).join('') + `</div>`;
      } catch (err) {}
    }

    async function loadSavedPosts() {
      const container = document.getElementById('content-saved');
      try {
        const res = await fetch(`/api/users/saved/${targetUserId}`, { credentials: 'include' });
        const posts = await res.json();

        if (!posts || posts.length === 0) {
          container.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            <p>No saved posts.</p>
          </div>`;
          return;
        }

        const mediaPosts = posts.filter(p => p.postType === 'image' || p.postType === 'video');

        if (mediaPosts.length > 0) {
          container.innerHTML = `<div class="post-grid">` + mediaPosts.map(p => `
            <div class="grid-item" onclick="window.location.href='/post.html?id=${esc(p._id)}'">
              <img src="${esc(p.mediaUrl)}" onerror="this.style.display='none'">
            </div>
          `).join('') + `</div>`;
        } else {
          container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">No saved images/videos.</p>';
        }
      } catch (err) {}
    }

    init();
  </script>
</body>
</html>
