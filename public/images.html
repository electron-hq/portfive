<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Images - PortFive</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#09090B">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000; /* Midnight Canvas */
      --surface: #09090B; --text: #FFFFFF;
      --text-muted: #A1A1AA; --line: #27272A;
      --accent: #6366F1; --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; overflow: hidden; }

    /* 100dvh handles mobile address bars better */
    .scroller-container { height: calc(100dvh - 65px); overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
    .scroller-container::-webkit-scrollbar { display: none; }

    /* Main Slide Layout */
    .image-slide { height: calc(100dvh - 65px); scroll-snap-align: start; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
    
    /* Content Area (Takes remaining space, centers image) */
    .content-area { 
      flex: 1; 
      min-height: 0; /* CRITICAL: Allows flex child to shrink and prevents pushing siblings out */
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      padding: 16px; 
    }
    
    /* Wrapper for Image and Ad */
    .image-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
      gap: 12px;
    }

    .post-image { 
      max-width: 100%; 
      max-height: 100%; 
      object-fit: contain; 
      user-select: none; 
      -webkit-user-drag: none; 
      border-radius: 6px; 
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6); 
    }
    
    /* Ad Space (Does not shrink) */
    .ad-box { 
      width: 100%; 
      height: 55px; 
      background: #FFFFFF; 
      color: #000000; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      border-radius: 4px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    
    /* Heart Animation */
    .heart-animation { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); color: var(--red); opacity: 0; pointer-events: none; z-index: 30; }
    .heart-animation.animate { animation: heartPop 0.8s ease-out; }
    @keyframes heartPop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }

    /* Pinterest-style Action Bar (Fixed at bottom of slide, does not shrink) */
    .action-bar { 
      height: 65px; 
      padding: 0 16px; 
      background: var(--surface); 
      border-top: 1px solid var(--line); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-shrink: 0; 
      z-index: 10; 
    }
    
    .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; overflow: hidden; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #27272A; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
    .user-text { display: flex; flex-direction: column; }
    .username { font-weight: 600; font-size: 0.95rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .caption { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }

    .actions { display: flex; align-items: center; gap: 16px; }
    .action-btn { background: none; border: none; cursor: pointer; color: var(--text); display: flex; align-items: center; gap: 6px; padding: 4px; transition: 0.2s; }
    .action-btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s; }
    .action-btn.liked svg { fill: var(--red); stroke: var(--red); transform: scale(1.1); }
    .action-count { font-size: 0.9rem; font-weight: 600; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 65px; z-index: 1000; max-width: 600px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 0.6rem; font-weight: 600; gap: 4px; }
    .nav-item.active { color: #FFFFFF; }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
    .nav-item.profile-nav .profile-pic { width: 24px; height: 24px; border-radius: 50%; background: #333; background-size: cover; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    .state-msg { color: white; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="scroller-container" id="scroller">
    <div class="state-msg">Loading images...</div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>Jobs</a>
    <a href="/pens.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Pens</a>
    <a href="/home.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home</a>
    <a href="/images.html" class="nav-item active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>Images</a>
    <a href="/profile.html" class="nav-item profile-nav" id="navProfile"><div class="profile-pic" id="navProfilePic"></div></a>
  </div>

  <script>
    function esc(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeUrl(url) {
      return String(url || '').replace(/'/g, '%27').replace(/"/g, '%22').replace(/\(/g, '%28').replace(/\)/g, '%29').replace(/\s/g, '%20').replace(/</g, '%3C').replace(/>/g, '%3E');
    }
    function formatCount(num) {
      if (!num) return 0;
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return num;
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed: ', err));
      });
    }

    async function initAuth() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          const navPic = document.getElementById('navProfilePic');
          if (data.user.profilePic) navPic.style.backgroundImage = `url('${safeUrl(data.user.profilePic)}')`;
          else { 
            navPic.style.background = '#E4E4E7'; 
            navPic.innerHTML = `<span style="color:#09090B; font-weight:700; font-size:14px;">${esc(data.user.fullName.charAt(0).toUpperCase())}</span>`; 
          }
          loadImages();
        } else { window.location.href = '/login.html'; }
      } catch (err) { window.location.href = '/login.html'; }
    }

    async function loadImages() {
      const scroller = document.getElementById('scroller');
      try {
        const res = await fetch('/api/posts/top/image', { credentials: 'include' });
        const images = await res.json();

        if (!images || images.length === 0) {
          scroller.innerHTML = '<div class="state-msg">No images yet.<br><span style="font-size:0.85rem; color:#71717A; margin-top:10px;">Be the first to upload!</span></div>';
          return;
        }

        scroller.innerHTML = images.map(img => {
          const author = img.author || {};
          const authorId = author._id || '';
          const username = author.username || 'unknown';
          const authorName = author.fullName || username;
          const profilePic = author.profilePic || '';
          
          const showAd = author.allowAds === true;
          const caption = img.caption || 'No caption';
          const hasLiked = img.hasLiked || false;
          const likesCount = img.likesCount || 0;
          const commentsCount = img.commentsCount || 0;

          return `
          <div class="image-slide" data-id="${esc(img._id)}">
            
            <div class="content-area">
              <div class="image-wrapper">
                <img src="${esc(img.mediaUrl)}" class="post-image" onerror="this.src='https://via.placeholder.com/600x800/111111/ffffff?text=Image+Not+Found'">
                
                ${showAd ? `
                <div class="ad-box">
                  Ads...
                </div>` : ''}
              </div>
              <div class="heart-animation" id="heart-${esc(img._id)}">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="#EF4444" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
              </div>
            </div>

            <div class="action-bar">
              <div class="user-info" onclick="window.location.href='/profile.html?id=${esc(authorId)}'">
                <div class="avatar" style="${profilePic ? `background-image: url('${safeUrl(profilePic)}')` : ''}">${profilePic ? '' : esc(authorName.charAt(0).toUpperCase())}</div>
                <div class="user-text">
                  <span class="username">@${esc(username)}</span>
                  <span class="caption">${esc(caption)}</span>
                </div>
              </div>
              
              <div class="actions">
                <button class="action-btn ${hasLiked ? 'liked' : ''}" id="like-btn-${esc(img._id)}" onclick="toggleLike('${esc(img._id)}')">
                  <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                  <span class="action-count" id="like-count-${esc(img._id)}">${formatCount(likesCount)}</span>
                </button>
                <button class="action-btn" onclick="window.location.href='/post.html?id=${esc(img._id)}'">
                  <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                  <span class="action-count">${formatCount(commentsCount)}</span>
                </button>
              </div>
            </div>

          </div>
        `}).join('');

        setupDoubleTapLike();
      } catch (err) { 
        console.error(err);
        scroller.innerHTML = '<div class="state-msg">Failed to load images.</div>'; 
      }
    }

    async function toggleLike(postId, isDoubleTap = false) {
      const btn = document.getElementById(`like-btn-${postId}`);
      const countSpan = document.getElementById(`like-count-${postId}`);
      if (!btn || !countSpan) return;
      const currentlyLiked = btn.classList.contains('liked');
      if (isDoubleTap && currentlyLiked) return;

      let currentText = countSpan.innerText;
      let num = parseFloat(currentText) || 0;
      if(currentText.includes('k')) num = num * 1000;
      
      if (currentlyLiked) { 
        btn.classList.remove('liked'); 
        countSpan.innerText = formatCount(Math.max(0, num - 1)); 
      } else { 
        btn.classList.add('liked'); 
        countSpan.innerText = formatCount(num + 1); 
      }

      try { 
        await fetch(`/api/posts/${postId}/react`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'love' }), credentials: 'include' }); 
      }
      catch (err) { 
        if (currentlyLiked) { 
          btn.classList.add('liked'); 
          countSpan.innerText = formatCount(num); 
        } else { 
          btn.classList.remove('liked'); 
          countSpan.innerText = formatCount(num); 
        } 
      }
    }

    function setupDoubleTapLike() {
      document.querySelectorAll('.image-slide').forEach(slide => {
        let lastTap = 0;
        slide.addEventListener('click', (e) => {
          if (e.target.closest('button') || e.target.closest('.user-info') || e.target.closest('iframe')) return;
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTap;
          if (tapLength < 300 && tapLength > 0) {
            const postId = slide.dataset.id;
            const heart = document.getElementById(`heart-${postId}`);
            heart.classList.add('animate');
            setTimeout(() => heart.classList.remove('animate'), 800);
            toggleLike(postId, true);
          }
          lastTap = currentTime;
        });
      });
    }

    initAuth();
  </script>
</body>
</html>
