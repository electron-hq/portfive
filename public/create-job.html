<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Post a Job - PortFive</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --text: #09090B;
      --text-muted: #71717A; --line: #E4E4E7;
      --primary: #18181B; --primary-hover: #27272A;
      --accent: #6366F1; --accent-light: #EEF2FF;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); padding-bottom: 40px; }

    .top-nav { position: sticky; top: 0; z-index: 100; background: rgba(250, 250, 250, 0.98); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--text); display: flex; align-items: center; padding: 6px; border-radius: 50%; transition: 0.2s; }
    .back-btn:hover { background: var(--line); }
    .back-btn svg { width: 22px; height: 22px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .nav-title { font-family: 'Archivo', sans-serif; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px; }

    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    
    .error-msg { background: #FEF2F2; color: var(--red); border: 1px solid #FECACA; padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; margin-bottom: 20px; display: none; }

    .form-group { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .form-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; color: var(--text); }
    .form-control { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; font-size: 0.95rem; font-family: inherit; color: var(--text); outline: none; transition: 0.2s; }
    .form-control:focus { border-color: var(--primary); }
    textarea.form-control { resize: vertical; min-height: 120px; }
    select.form-control { appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2371717A%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; padding-right: 40px; }

    .row-group { display: flex; gap: 16px; }
    .row-group .form-group { flex: 1; margin-bottom: 0; }

    .btn-publish { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 20px; font-family: 'Archivo', sans-serif; }
    .btn-publish:hover { background: var(--primary-hover); }
    .btn-publish:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>

  <div class="top-nav">
    <button class="back-btn" onclick="window.history.back()">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="nav-title">Post a Job</div>
    <div style="width: 34px;"></div>
  </div>

  <div class="container">
    <div class="error-msg" id="errorMsg"></div>

    <div class="form-group">
      <label class="form-label">Job Title *</label>
      <input type="text" class="form-control" id="title" placeholder="e.g. Frontend Developer" maxlength="100">
    </div>

    <div class="form-group">
      <label class="form-label">Company Name *</label>
      <input type="text" class="form-control" id="companyName" placeholder="e.g. Google, Startup Inc." maxlength="100">
    </div>

    <div class="row-group">
      <div class="form-group">
        <label class="form-label">Location</label>
        <input type="text" class="form-control" id="location" placeholder="e.g. Remote, Dhaka" maxlength="50">
      </div>
      <div class="form-group">
        <label class="form-label">Job Type</label>
        <select class="form-control" id="jobType">
          <option value="Full-time">Full-time</option>
          <option value="Part-time">Part-time</option>
          <option value="Contract">Contract</option>
          <option value="Freelance">Freelance</option>
        </select>
      </div>
    </div>

    <div class="form-group" style="margin-top: 16px;">
      <label class="form-label">Salary (Optional)</label>
      <input type="text" class="form-control" id="salary" placeholder="e.g. $50,000 / year or Negotiable" maxlength="50">
    </div>

    <div class="form-group">
      <label class="form-label">Job Description *</label>
      <textarea class="form-control" id="description" placeholder="Describe the responsibilities, requirements, etc." rows="6"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Apply Link (Optional)</label>
      <input type="url" class="form-control" id="applyLink" placeholder="https://company.com/careers/apply">
    </div>

    <button class="btn-publish" id="publishBtn" onclick="submitJob()">Post Job</button>
  </div>

  <script>
    async function submitJob() {
      const btn = document.getElementById('publishBtn');
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      const title = document.getElementById('title').value.trim();
      const companyName = document.getElementById('companyName').value.trim();
      const location = document.getElementById('location').value.trim();
      const jobType = document.getElementById('jobType').value;
      const salary = document.getElementById('salary').value.trim();
      const description = document.getElementById('description').value.trim();
      const applyLink = document.getElementById('applyLink').value.trim();

      if (!title || !companyName || !description) {
        errorMsg.innerText = 'Please fill in all required fields (Title, Company, Description).';
        errorMsg.style.display = 'block';
        window.scrollTo(0, 0);
        return;
      }

      if (applyLink && !/^https?:\/\//i.test(applyLink)) {
        errorMsg.innerText = 'Apply link must start with http:// or https://';
        errorMsg.style.display = 'block';
        window.scrollTo(0, 0);
        return;
      }

      btn.innerText = 'Posting...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ title, companyName, location, jobType, salary, description, applyLink })
        });

        const data = await res.json();

        if (res.ok) {
          window.location.href = '/jobs.html';
        } else {
          errorMsg.innerText = data.message || 'Failed to post job.';
          errorMsg.style.display = 'block';
          window.scrollTo(0, 0);
          btn.innerText = 'Post Job';
          btn.disabled = false;
        }
      } catch (err) {
        errorMsg.innerText = 'Server error. Please try again.';
        errorMsg.style.display = 'block';
        window.scrollTo(0, 0);
        btn.innerText = 'Post Job';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
