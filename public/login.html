<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PortFive</title>
  
  <!-- Favicon & PWA -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --text: #09090B;
      --text-muted: #71717A; --line: #E4E4E7;
      --primary: #18181B; --primary-hover: #27272A; --accent: #6366F1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: var(--surface); width: 100%; max-width: 400px; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--line); }
    .logo { text-align: center; font-size: 2rem; font-weight: 800; color: var(--text); margin-bottom: 25px; letter-spacing: -1px; }
    .logo span { color: var(--accent); }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text); }
    input { width: 100%; padding: 12px 15px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 1rem; outline: none; background: var(--bg); transition: 0.2s; }
    input:focus { border-color: var(--primary); background: var(--surface); }
    .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #EF4444; font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; }
    .links { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
    .links a { color: var(--text); text-decoration: none; font-weight: 600; }
    .links a:hover { color: var(--accent); }
    /* Turnstile Container Margin */
    .cf-turnstile { margin-top: 15px; margin-bottom: 5px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">Port<span>Five</span></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="@username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <!-- Turnstile Widget with Callback -->
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAFfS2ppXHpN_9kZg" data-theme="light" data-callback="onCaptchaSuccess"></div>

      <button type="submit" class="btn" id="submitBtn">Log In</button>
      <div class="error" id="errorMsg"></div>
    </form>
    <div class="links">
      <a href="/recover.html">Forgot Password?</a><br><br>
      Don't have an account? <a href="/register.html">Sign Up</a>
    </div>
  </div>

  <script>
    let turnstileToken = null;

    function onCaptchaSuccess(token) {
      turnstileToken = token;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      if (!turnstileToken) {
        errorMsg.innerText = 'Please complete the CAPTCHA verification.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.innerText = 'Logging in...'; btn.disabled = true; errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, captchaToken: turnstileToken })
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = '/home.html';
        } else {
          errorMsg.innerText = data.message;
          errorMsg.style.display = 'block';
          btn.innerText = 'Log In'; btn.disabled = false;
          // Reset Turnstile on failure
          if (typeof turnstile !== 'undefined') turnstile.reset();
          turnstileToken = null;
        }
      } catch (err) {
        errorMsg.innerText = 'Server error';
        errorMsg.style.display = 'block';
        btn.innerText = 'Log In'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
