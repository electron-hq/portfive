<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Create Post - PortFive</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; 
      --text-muted: #64748B; --line: #E2E8F0; --green: #10B981; 
      --green-dark: #059669; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

    /* Top Navbar */
    .top-nav { background: var(--surface); border-bottom: 1px solid var(--line); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    .close-btn { background: none; border: none; cursor: pointer; color: var(--text); display: flex; align-items: center; }
    .close-btn svg { width: 24px; height: 24px; stroke-width: 2; stroke: currentColor; fill: none; }
    .title { font-weight: 700; font-size: 1.1rem; }
    .btn-publish { background: var(--green); color: white; border: none; padding: 8px 20px; border-radius: 999px; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    .btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Tabs */
    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--line); }
    .tab { flex: 1; text-align: center; padding: 15px 0; font-weight: 600; font-size: 0.95rem; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; }
    .tab.active { color: var(--green); border-bottom-color: var(--green); }

    /* Form Container */
    .container { flex: 1; padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
    
    .form-group { margin-bottom: 20px; display: none; }
    .form-group.active { display: block; }

    input[type="text"], textarea { width: 100%; padding: 15px; border: 1px solid var(--line); border-radius: 12px; font-family: inherit; font-size: 1rem; outline: none; background: var(--surface); color: var(--text); }
    input[type="text"]:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
    
    textarea { resize: vertical; min-height: 250px; line-height: 1.6; }

    .file-upload { border: 2px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; background: var(--surface); transition: 0.2s; position: relative; overflow: hidden; }
    .file-upload:hover { border-color: var(--green); background: #F0FDF4; }
    .file-upload svg { width: 40px; height: 40px; stroke: var(--green); fill: none; margin-bottom: 10px; }
    .file-upload p { color: var(--text-muted); font-size: 0.9rem; }
    .file-upload input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    
    .preview-img { width: 100%; border-radius: 12px; margin-top: 15px; display: none; object-fit: cover; }
    
    /* Pen Specific */
    .pen-cover-preview { width: 100%; aspect-ratio: 3 / 1; border-radius: 12px; margin-top: 15px; display: none; background-size: cover; background-position: center; border: 1px solid var(--line); }
    .char-count { text-align: right; font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; }

    .error-msg { color: #EF4444; font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; }
  </style>
</head>
<body>

  <div class="top-nav">
    <button class="close-btn" onclick="window.history.back()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="title">Create New</div>
    <button class="btn-publish" id="publishBtn" onclick="submitPost()">Publish</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('image')">Image</div>
    <div class="tab" onclick="switchTab('video')">Video</div>
    <div class="tab" onclick="switchTab('pen')">Pen (Article)</div>
  </div>

  <div class="container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="postForm">
      
      <!-- Image Post -->
      <div class="form-group active" id="group-image">
        <div class="file-upload">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          <p>Click to upload an image</p>
          <input type="file" id="imageFile" accept="image/*" onchange="previewFile(this, 'imagePreview')">
        </div>
        <img id="imagePreview" class="preview-img">
        <input type="text" id="imageCaption" placeholder="Write a caption..." style="margin-top: 15px;">
      </div>

      <!-- Video Post -->
      <div class="form-group" id="group-video">
        <div class="file-upload">
          <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          <p>Click to upload a video</p>
          <input type="file" id="videoFile" accept="video/*" onchange="previewFile(this, 'videoPreview')">
        </div>
        <video id="videoPreview" class="preview-img" controls style="display:none; max-height: 300px; background: #000;"></video>
        <input type="text" id="videoCaption" placeholder="Write a caption..." style="margin-top: 15px;">
      </div>

      <!-- Pen (Article) Post -->
      <div class="form-group" id="group-pen">
        <input type="text" id="penTitle" placeholder="Article Title" style="margin-bottom: 15px; font-weight: 700; font-size: 1.2rem;">
        
        <div class="file-upload" style="padding: 20px;">
          <p style="font-size: 0.8rem;">Optional: Add a Cover Image (Recommended 1200x400)</p>
          <input type="file" id="penCoverFile" accept="image/*" onchange="previewPenCover(this)">
        </div>
        <div id="penCoverPreview" class="pen-cover-preview"></div>

        <textarea id="penContent" placeholder="Write your article here... (Max 8000 characters)" maxlength="8000" oninput="updateCharCount()" style="margin-top: 15px;"></textarea>
        <div class="char-count" id="charCount">0 / 8000</div>
      </div>

    </form>
  </div>

  <script>
    let currentTab = 'image';

    // Check Auth
    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (!res.ok) window.location.href = '/login.html';
      } catch (err) {
        window.location.href = '/login.html';
      }
    }
    checkAuth();

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-group').forEach(g => g.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`group-${tab}`).classList.add('active');
    }

    function previewFile(input, previewId) {
      const preview = document.getElementById(previewId);
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.src = e.target.result;
          preview.style.display = 'block';
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function previewPenCover(input) {
      const preview = document.getElementById('penCoverPreview');
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.style.backgroundImage = `url(${e.target.result})`;
          preview.style.display = 'block';
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function updateCharCount() {
      const val = document.getElementById('penContent').value.length;
      document.getElementById('charCount').innerText = `${val} / 8000`;
    }

    async function submitPost() {
      const btn = document.getElementById('publishBtn');
      const errorMsg = document.getElementById('errorMsg');
      
      const formData = new FormData();
      formData.append('postType', currentTab);

      if (currentTab === 'image') {
        const file = document.getElementById('imageFile').files[0];
        if (!file) return showError('Please select an image.');
        formData.append('media', file);
        formData.append('caption', document.getElementById('imageCaption').value);
      } 
      else if (currentTab === 'video') {
        const file = document.getElementById('videoFile').files[0];
        if (!file) return showError('Please select a video.');
        formData.append('media', file);
        formData.append('caption', document.getElementById('videoCaption').value);
      } 
      else if (currentTab === 'pen') {
        const title = document.getElementById('penTitle').value;
        const content = document.getElementById('penContent').value;
        if (!title || !content) return showError('Title and Content are required for a Pen.');
        
        formData.append('title', title);
        formData.append('content', content);
        
        const coverFile = document.getElementById('penCoverFile').files[0];
        if (coverFile) formData.append('media', coverFile);
      }

      btn.innerText = 'Publishing...'; btn.disabled = true; errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/posts', {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });
        
        const data = await res.json();
        
        if (res.ok) {
          window.location.href = '/home.html';
        } else {
          showError(data.message || 'Failed to create post');
          btn.innerText = 'Publish'; btn.disabled = false;
        }
      } catch (err) {
        showError('Server error. Please try again.');
        btn.innerText = 'Publish'; btn.disabled = false;
      }
    }

    function showError(msg) {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.innerText = msg;
      errorMsg.style.display = 'block';
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
